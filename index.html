<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0E1116"><link rel="apple-touch-icon" href="icon-192.png">
<title>دكانك</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1116;--card:#171B22;--ink:#F2EFE6;--mute:#98A0AC;--line:#272D37;--a:#D9AE4F;--on:#17120a;--bad:#e5766a;--ok:#5cc08a;color-scheme:dark}
html[data-theme=light]{--bg:#F6F4EE;--card:#fff;--ink:#1b1a16;--mute:#6d6a60;--line:#e5e1d5;--a:#9A6F0A;--on:#fff;--bad:#c0392b;--ok:#1f8a52;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.65 "IBM Plex Sans Arabic",system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;background:var(--bg)}input:focus{outline:none;border-color:var(--a)}
button:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 18px 8px}.top b{font-size:21px;flex:1}
.logo{width:38px;height:38px;border-radius:12px;background:var(--a);color:var(--on);display:grid;place-items:center;font-size:19px}
.pad{padding:0 18px}h2{font-size:17px;margin:22px 0 10px}.lbl{font-size:13px;color:var(--mute);margin:12px 0 5px;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:14px;border-radius:14px;background:var(--a);color:var(--on);font-weight:700}
.btn.ghost{background:transparent;color:var(--a);border:1.5px solid color-mix(in srgb,var(--a) 55%,transparent)}.btn[disabled]{opacity:.4}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 15px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px;color:var(--mute)}.chip.on{background:var(--a);border-color:var(--a);color:var(--on)}
.tabs{position:fixed;inset:auto 0 0;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;padding:7px 4px;border-radius:12px;color:var(--mute);font-weight:600;font-size:12.5px;display:grid;gap:1px;justify-items:center}.tabs button span{font-size:20px}.tabs button.on{color:var(--a)}
.sc{display:flex;gap:12px;align-items:center;margin-bottom:10px;cursor:pointer}
.av{width:52px;height:52px;border-radius:17px;border:2px solid var(--a);color:var(--a);display:grid;place-items:center;font-size:24px;font-weight:700;flex:none}
.g{flex:1;min-width:0}.nm{font-weight:600}.pr{color:var(--mute);font-size:13.5px}.gd{color:var(--a);font-weight:700}
.hero{background:radial-gradient(120% 100% at 100% 0%,color-mix(in srgb,var(--a) 24%,transparent),transparent 62%),var(--card);padding:calc(26px + env(safe-area-inset-top)) 20px 24px;border-radius:0 0 30px 30px;border-bottom:1.5px solid color-mix(in srgb,var(--a) 50%,transparent);position:relative}
.hero h1{margin:10px 0 0;font-size:25px;line-height:1.3}.hero p{margin:4px 0 0;color:var(--mute)}
.ib{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-end:16px}
.info{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.info span{font-size:12.5px;padding:5px 11px;border-radius:99px;background:color-mix(in srgb,var(--a) 14%,transparent);color:var(--a);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 18px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;position:relative}.pc.so{opacity:.55}
.im{aspect-ratio:1/.8;display:grid;place-items:center;font-size:52px;background:color-mix(in srgb,var(--a) 9%,var(--bg));overflow:hidden}.im img,.th img{width:100%;height:100%;object-fit:cover}
.bdg{position:absolute;top:10px;inset-inline-start:10px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--a);color:var(--on)}
.bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}.ds{font-size:12.5px;color:var(--mute)}
.ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}.pz{font-weight:700;color:var(--a);line-height:1.2}.pz s{display:block;color:var(--mute);font-weight:400;font-size:12px}
.add{width:36px;height:36px;border-radius:12px;background:var(--a);color:var(--on);font-size:22px}
.st{display:flex;align-items:center;background:color-mix(in srgb,var(--a) 16%,var(--bg));border-radius:12px}.st button{width:32px;height:36px;font-size:20px;color:var(--a);font-weight:700}.st b{min-width:18px;text-align:center}
.cbar{position:fixed;inset:auto 14px calc(76px + env(safe-area-inset-bottom));z-index:6}.cbar .btn{justify-content:space-between;padding:15px 18px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));border-top:1.5px solid color-mix(in srgb,var(--a) 50%,transparent)}
.pi{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}.th{width:52px;height:52px;border-radius:14px;background:color-mix(in srgb,var(--a) 12%,var(--bg));display:grid;place-items:center;font-size:27px;overflow:hidden;flex:none}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mini{padding:7px 12px;border-radius:10px;font-weight:600;font-size:13px;border:1.5px solid var(--line);color:var(--mute);text-decoration:none;display:inline-block}.mini.bad{color:var(--bad)}.mini.ok{color:var(--ok);border-color:var(--ok)}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700}.tag.new{background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--a)}.tag.done{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.tag.cancelled{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}.kpi .card{text-align:center;padding:10px 6px;display:grid}.kpi b{font-size:16px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--a);border-radius:9px}
.empty{text-align:center;color:var(--mute);padding:26px 14px;border:1.5px dashed var(--line);border-radius:18px;margin:6px 0}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin:10px 0 14px;padding-top:10px;border-top:1px solid var(--line)}
.stars button{font-size:34px;color:var(--line)}.stars button.on{color:var(--a)}
.toast{position:fixed;inset-inline:0;bottom:calc(110px + env(safe-area-inset-bottom));margin:auto;width:max-content;max-width:88%;background:var(--a);color:var(--on);padding:10px 18px;border-radius:99px;z-index:30;display:none;font-weight:700}
</style>
</head>
<body>
<div id="app"></div><nav class="tabs" id="nav"></nav><div id="sh"></div><div class="toast" id="toast"></div>
<script>
const CFG={url:'https://ojazsslcfwiwvjsbohyc.supabase.co',key:'sb_publishable_MWPL0ekEy-2LuRVIbgvMUQ_94K3i6qf'}; /* ← الصق رابط ومفتاح Supabase هنا */
const demo=!CFG.url,$=i=>document.getElementById(i),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isImg=s=>/^https?:\/\//.test(s),ic=s=>isImg(s)?`<img src="${esc(s)}" alt="" loading="lazy">`:esc(s||'🛍️');
const money=n=>String(Math.round((+n||0)*100)/100),sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0),stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
const ST={new:'جديد',done:'تم التسليم',cancelled:'ملغي'},desc=(a,b)=>String(b.created_at).localeCompare(String(a.created_at));
let theme='dark';try{theme=localStorage.getItem('dk-theme')||'dark'}catch(e){}
const paint=()=>{document.documentElement.dataset.theme=theme;document.querySelector('meta[name=theme-color]').content=theme==='dark'?'#0E1116':'#F6F4EE'};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2400)}
let DB,U=null,TAB='home',VIEW=null,CUR=null,HOME=null,MS=null,CART={sid:null,q:{}},F={q:'',cat:''},SS='orders',EDIT=null,AUTH='in',RS=null;
let OS={mode:'d',pay:'كاش',n:'',ph:'',a:'',m:''};

/* ===== طبقة البيانات: تجريبية محلية أو Supabase ===== */
const L=()=>{try{return JSON.parse(localStorage.getItem('dk2'))||{}}catch(e){return{}}},LS=d=>{try{localStorage.setItem('dk2',JSON.stringify(d))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const localDB={
 async sel(t,eq={}){return(L()[t]||[]).filter(r=>Object.keys(eq).every(k=>r[k]===eq[k]))},
 async ins(t,r){const d=L();r={id:uid(),created_at:new Date().toISOString(),...r};(d[t]=d[t]||[]).push(r);LS(d);return r},
 async upd(t,id,p){const d=L(),r=(d[t]||[]).find(x=>x.id===id);if(r){Object.assign(r,p);LS(d)}},
 async del(t,id){const d=L();d[t]=(d[t]||[]).filter(x=>x.id!==id);LS(d)},
 async visit(sid){const d=L();d.visits=d.visits||[];let v=d.visits.find(x=>x.store_id===sid);if(!v){v={store_id:sid,n:0};d.visits.push(v)}v.n++;LS(d)},
 async user(){const d=L();return(d.users||[]).find(u=>u.id===d.cur)||null},
 async signUp(email,pw,name){const d=L();d.users=d.users||[];if(d.users.some(u=>u.email===email))throw new Error('البريد مسجّل مسبقاً');const u={id:uid(),email,name,pw};d.users.push(u);d.cur=u.id;LS(d)},
 async signIn(email,pw){const d=L(),u=(d.users||[]).find(x=>x.email===email&&x.pw===pw);if(!u)throw new Error('البريد أو كلمة المرور غير صحيحة');d.cur=u.id;LS(d)},
 async signOut(){const d=L();delete d.cur;LS(d)}
};
const remoteDB=sb=>({
 async sel(t,eq={}){let q=sb.from(t).select('*');for(const k in eq)q=q.eq(k,eq[k]);const{data,error}=await q;if(error)throw error;return data||[]},
 async ins(t,r){const{data,error}=await sb.from(t).insert(r).select().single();if(error)throw error;return data},
 async upd(t,id,p){const{error}=await sb.from(t).update(p).eq('id',id);if(error)throw error},
 async del(t,id){const{error}=await sb.from(t).delete().eq('id',id);if(error)throw error},
 async visit(sid){await sb.rpc('track_visit',{sid})},
 async user(){const{data}=await sb.auth.getSession(),u=data&&data.session&&data.session.user;return u?{id:u.id,email:u.email,name:(u.user_metadata||{}).name||u.email}:null},
 async signUp(email,pw,name){const{error}=await sb.auth.signUp({email,password:pw,options:{data:{name}}});if(error)throw error},
 async signIn(email,pw){const{error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error},
 async signOut(){await sb.auth.signOut()}
});
function seed(){const d=L();if(d.stores)return;const t=new Date().toISOString();
 d.stores=[{id:'s1',owner:'seed',name:'حلويات أم أحمد',tagline:'كنافة وبقلاوة طازجة كل يوم',whatsapp:'962790000001',city:'عمّان',category:'حلويات',currency:'$',delivery_fee:2,min_order:5,hours:'10 ص – 10 م',active:true},{id:'s2',owner:'seed',name:'عطور الأصيل',tagline:'عود ومسك ودهن أصلي',whatsapp:'966500000002',city:'الرياض',category:'عطور',currency:'ر.س',delivery_fee:15,min_order:0,hours:'4 م – 12 ص',active:true},{id:'s3',owner:'seed',name:'ركن الموضة',tagline:'عبايات وأزياء عصرية',whatsapp:'971500000003',city:'دبي',category:'ملابس',currency:'د.إ',delivery_fee:10,min_order:50,hours:'يومياً',active:true}];
 d.products=[['s1','🍰','كنافة نابلسية',10,12],['s1','🥐','بقلاوة مشكلة',8,0],['s2','🧴','دهن عود ملكي',120,150],['s2','🕯️','بخور فاخر',40,0],['s3','👗','عباية سوداء',180,220],['s3','👜','شنطة جلد',95,0]].map((p,i)=>({id:'p'+i,store_id:p[0],icon:p[1],name:p[2],price:p[3],old_price:p[4]||null,sold_out:false,created_at:t}));
 d.reviews=[{id:'r1',store_id:'s1',buyer:'x',buyer_name:'سارة',rating:5,comment:'كنافة ممتازة وتوصيل سريع',created_at:t},{id:'r2',store_id:'s2',buyer:'y',buyer_name:'خالد',rating:4,comment:'ريحة حلوة',created_at:t}];LS(d)}
const load=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)});

/* ===== الهيكل ===== */
const hdr=t=>`<div class="top"><div class="logo">🛍️</div><b>${t}</b>${demo?'<span class="tag new">تجريبي</span>':''}</div>`;
const nav=()=>{$('nav').innerHTML=[['home','🏠','الرئيسية'],['sell','🏪','بائع'],['buy','🛒','مشتري'],['me','👤','أنا']].map(([k,i,t])=>`<button data-tab="${k}" class="${!VIEW&&TAB===k?'on':''}"><span>${i}</span>${t}</button>`).join('')};
async function render(){nav();$('sh').innerHTML='';app.innerHTML='<div class="empty" style="margin:40px 18px">جارٍ التحميل…</div>';
 try{if(VIEW)await storeView(VIEW);else await({home,sell,buy,me})[TAB]()}catch(e){app.innerHTML=`<div class="pad"><div class="empty">تعذّر التحميل: ${esc(e.message||e)}</div></div>`}}
const needLogin=m=>{app.innerHTML=hdr('دكانك')+`<div class="pad"><div class="empty">${m}<br><br><button class="btn" data-tab="me">تسجيل الدخول</button></div></div>`};
const rating=(id,rv)=>{const r=rv.filter(x=>x.store_id===id);return r.length?{a:sum(r,x=>x.rating)/r.length,n:r.length}:null};

/* ===== الرئيسية ===== */
async function home(){
 const[st,rv]=await Promise.all([DB.sel('stores'),DB.sel('reviews')]);HOME={st:st.filter(x=>x.active!==false),rv};
 app.innerHTML=hdr('دكانك')+`<div class="pad"><input id="hq" placeholder="ابحث عن متجر أو مدينة…" value="${esc(F.q)}"><div class="chips" id="hc" style="margin-top:10px"></div><div id="hl"></div></div>`;drawHome()}
function drawHome(){const{st,rv}=HOME,cats=[...new Set(st.map(x=>x.category).filter(Boolean))];
 $('hc').innerHTML=['',...cats].map(c=>`<button class="chip ${c===F.cat?'on':''}" data-cat="${esc(c)}">${c?esc(c):'الكل'}</button>`).join('');
 const l=st.filter(x=>(!F.cat||x.category===F.cat)&&(!F.q||(x.name+' '+(x.tagline||'')+' '+(x.city||'')).includes(F.q)));
 $('hl').innerHTML=l.length?l.map(x=>{const r=rating(x.id,rv);return`<div class="card sc" data-open="${x.id}"><div class="av">${esc([...x.name][0]||'د')}</div><div class="g"><div class="nm">${esc(x.name)}</div><div class="pr">${esc(x.tagline||'')}</div><div class="pr">${r?`<span class="gd">★ ${r.a.toFixed(1)}</span> (${r.n}) · `:'جديد · '}${esc(x.city||'')}${x.category?' · '+esc(x.category):''}</div></div></div>`}).join(''):'<div class="empty">لا توجد متاجر بعد. كن أول من يفتح متجراً من تبويب "بائع".</div>'}

/* ===== صفحة المتجر والسلة ===== */
async function storeView(id){
 const[ss,pp,rv]=await Promise.all([DB.sel('stores',{id}),DB.sel('products',{store_id:id}),DB.sel('reviews',{store_id:id})]),s=ss[0];
 if(!s){VIEW=null;return render()}
 CUR={s,pp,rv};if(CART.sid!==id)CART={sid:id,q:{}};
 if(!(U&&U.id===s.owner)&&!sessionStorage.getItem('v'+id)){try{sessionStorage.setItem('v'+id,1)}catch(e){}DB.visit(id).catch(()=>{})}
 const r=rating(id,rv);
 app.innerHTML=`<div class="hero"><button class="ib" data-back="1" aria-label="رجوع">→</button><div class="av">${esc([...s.name][0]||'د')}</div><h1>${esc(s.name)}</h1>${s.tagline?`<p>${esc(s.tagline)}</p>`:''}
 <div class="info">${r?`<span>★ ${r.a.toFixed(1)} (${r.n})</span>`:'<span>متجر جديد</span>'}${s.city?`<span>📍 ${esc(s.city)}</span>`:''}${s.hours?`<span>🕒 ${esc(s.hours)}</span>`:''}${+s.delivery_fee?`<span>🛵 ${money(s.delivery_fee)} ${esc(s.currency)}</span>`:''}${+s.min_order?`<span>أقل طلب ${money(s.min_order)} ${esc(s.currency)}</span>`:''}</div></div>
 <div class="grid" id="grid"></div><div class="pad">${rv.length?'<h2>آراء الزبائن</h2>'+rv.slice().sort(desc).slice(0,5).map(x=>`<div class="card" style="margin-bottom:8px"><span class="gd">${stars(x.rating)}</span> ${esc(x.buyer_name||'')}<div class="pr">${esc(x.comment||'')}</div></div>`).join(''):''}</div><div class="cbar" id="cbar"></div>`;drawStore()}
const items=()=>CUR.pp.map(p=>({p,n:CART.q[p.id]||0})).filter(x=>x.n),cnt=()=>sum(items(),x=>x.n),sub=()=>sum(items(),x=>x.n*x.p.price);
function drawStore(){const{s,pp}=CUR;
 $('grid').innerHTML=pp.length?pp.map(p=>{const so=p.sold_out,sale=+p.old_price>+p.price,n=CART.q[p.id]||0;return`<div class="pc ${so?'so':''}"><div class="im">${ic(p.icon)}</div>${so?'<span class="bdg" style="background:#000a;color:#fff">نفد</span>':sale?'<span class="bdg">خصم</span>':''}<div class="bd"><div class="nm">${esc(p.name)}</div>${p.description?`<div class="ds">${esc(p.description)}</div>`:''}<div class="ft"><span class="pz">${sale?`<s>${money(p.old_price)}</s>`:''}${money(p.price)} ${esc(s.currency)}</span>${so?'':n?`<div class="st"><button data-m="${p.id}" aria-label="إنقاص">−</button><b>${n}</b><button data-a="${p.id}" aria-label="زيادة">+</button></div>`:`<button class="add" data-a="${p.id}" aria-label="أضف">+</button>`}</div></div></div>`}).join(''):'<div class="empty" style="grid-column:1/-1">لم يضف المتجر منتجات بعد</div>';
 $('cbar').innerHTML=cnt()?`<button class="btn" data-sheet="1"><span>عرض السلة (${cnt()})</span><span>${money(sub())} ${esc(s.currency)}</span></button>`:''}
function cartSheet(){const l=items(),{s}=CUR;if(!l.length){$('sh').innerHTML='';return}
 const sb=sub(),dl=OS.mode==='d'?+s.delivery_fee||0:0,low=+s.min_order&&sb<+s.min_order;if(!OS.n&&U)OS.n=U.name;
 $('sh').innerHTML=`<div class="sheet"><div><h2 style="margin-top:0">طلبك من ${esc(s.name)}</h2>${l.map(x=>`<div class="card pi"><div class="th">${ic(x.p.icon)}</div><div class="g"><div class="nm">${esc(x.p.name)}</div><div class="pr">${money(x.n*x.p.price)} ${esc(s.currency)}</div></div><div class="st"><button data-m="${x.p.id}" data-s="1">−</button><b>${x.n}</b><button data-a="${x.p.id}" data-s="1">+</button></div></div>`).join('')}
 <div class="chips"><button class="chip ${OS.mode==='d'?'on':''}" data-mode="d">🛵 توصيل</button><button class="chip ${OS.mode==='p'?'on':''}" data-mode="p">🏪 استلام</button><button class="chip ${OS.pay==='كاش'?'on':''}" data-pay="كاش">💵 كاش</button><button class="chip ${OS.pay==='تحويل'?'on':''}" data-pay="تحويل">🏦 تحويل</button></div>
 <input data-k="n" placeholder="اسمك" value="${esc(OS.n)}" style="margin:6px 0 8px"><input data-k="ph" placeholder="رقم جوالك (اختياري)" inputmode="numeric" value="${esc(OS.ph)}" style="margin-bottom:8px">
 ${OS.mode==='d'?`<input data-k="a" placeholder="العنوان" value="${esc(OS.a)}" style="margin-bottom:8px">`:''}<input data-k="m" placeholder="ملاحظات (اختياري)" value="${esc(OS.m)}">
 <div class="tot"><span>المجموع${dl?` (+توصيل ${money(dl)})`:''}</span><span>${money(sb+dl)} ${esc(s.currency)}</span></div>${low?`<div class="pr" style="color:var(--bad);margin-bottom:8px">أقل طلب ${money(s.min_order)} ${esc(s.currency)}</div>`:''}
 <button class="btn" id="send" ${low?'disabled':''}>إرسال الطلب عبر واتساب</button><button class="btn ghost" data-close="1" style="margin-top:10px">متابعة التسوق</button></div></div>`}
async function send(){const l=items(),{s}=CUR,sb=sub(),dl=OS.mode==='d'?+s.delivery_fee||0:0,total=sb+dl;
 if(!U){toast('سجّل دخولك أولاً لإتمام الطلب');VIEW=null;TAB='me';return render()}
 if(OS.mode==='d'&&!OS.a.trim())return toast('اكتب عنوان التوصيل');
 const o=await DB.ins('orders',{store_id:s.id,store_name:s.name,buyer:U.id,buyer_name:OS.n||U.name,phone:OS.ph.replace(/\D/g,''),addr:OS.a,notes:OS.m,items:l.map(x=>({n:x.p.name,q:x.n,p:x.p.price})),delivery:dl,total,mode:OS.mode,pay:OS.pay,status:'new'});
 const no=String(o.id).slice(0,5).toUpperCase();
 const msg=`طلب جديد #${no} 🛒\n`+l.map(x=>`• ${x.p.name} × ${x.n} = ${money(x.n*x.p.price)} ${s.currency}`).join('\n')+(dl?`\nالتوصيل: ${money(dl)} ${s.currency}`:'')+`\nالمجموع: ${money(total)} ${s.currency}\n`+(OS.mode==='d'?'🛵 توصيل':'🏪 استلام')+` | الدفع: ${OS.pay}`+(OS.n?`\nالاسم: ${OS.n}`:'')+(OS.mode==='d'&&OS.a?`\nالعنوان: ${OS.a}`:'')+(OS.m?`\nملاحظات: ${OS.m}`:'');
 CART={sid:null,q:{}};TAB='buy';VIEW=null;toast('تم حفظ طلبك');
 if(String(s.whatsapp||'').length>=8)location.href=`https://wa.me/${s.whatsapp}?text=${encodeURIComponent(msg)}`;else render()}

/* ===== البائع ===== */
function storeForm(s){const f=[['name','اسم المتجر'],['tagline','وصف قصير'],['whatsapp','رقم واتساب مع رمز الدولة (962791234567)'],['city','المدينة'],['category','القسم (حلويات، ملابس…)'],['currency','العملة ($ د.أ ر.س)'],['delivery_fee','رسوم التوصيل'],['min_order','أقل قيمة للطلب'],['hours','ساعات العمل']];
 return`<div class="card">`+f.map(([k,l])=>`<label class="lbl">${l}</label><input id="sf_${k}" value="${esc(s?s[k]:k==='currency'?'$':'')}" ${['whatsapp','delivery_fee','min_order'].includes(k)?'inputmode="numeric"':''}>`).join('')+`<button class="btn" id="${s?'ssave':'screate'}" style="margin-top:14px">${s?'حفظ التغييرات':'إنشاء المتجر'}</button>${s?`<button class="btn ghost" data-act="1" style="margin-top:10px">${s.active===false?'إظهار المتجر':'إخفاء المتجر مؤقتاً'}</button><button class="btn ghost" id="sshare" style="margin-top:10px">نسخ رابط متجري</button>`:''}</div>`}
const readStore=()=>{const o={};['name','tagline','whatsapp','city','category','currency','delivery_fee','min_order','hours'].forEach(k=>o[k]=$('sf_'+k).value.trim());o.whatsapp=o.whatsapp.replace(/\D/g,'');o.delivery_fee=+o.delivery_fee||0;o.min_order=+o.min_order||0;o.currency=o.currency||'$';return o};
async function sellerKpi(s,os){const[vs,rv]=await Promise.all([DB.sel('visits',{store_id:s.id}),DB.sel('reviews',{store_id:s.id})]);os=os||await DB.sel('orders',{store_id:s.id});
 const d=os.filter(o=>o.status==='done'),r=rating(s.id,rv);
 return`<div class="kpi">${[['👁️',sum(vs,x=>x.n),'زيارة'],['📦',os.length,'طلب'],['✅',d.length,'مبيعة'],['💰',money(sum(d,o=>o.total)),'الدخل '+esc(s.currency)],['⭐',r?r.a.toFixed(1):'—','التقييم'],['⏳',os.filter(o=>o.status==='new').length,'بانتظارك']].map(([i,v,l])=>`<div class="card"><div>${i}</div><b>${v}</b><span class="pr">${l}</span></div>`).join('')}</div>`}
async function sell(){
 if(!U)return needLogin('سجّل دخولك لتفتح متجرك وتبدأ البيع');
 const[s]=await DB.sel('stores',{owner:U.id});MS=s;
 if(!s){app.innerHTML=hdr('افتح متجرك')+`<div class="pad">${storeForm(null)}</div>`;return}
 let h='';if(SS==='orders'){const os=(await DB.sel('orders',{store_id:s.id})).sort(desc);
  h=await sellerKpi(s,os)+'<h2>الطلبات</h2>'+(os.length?os.map(o=>`<div class="card" style="margin-bottom:10px"><div class="row2"><b>#${String(o.id).slice(0,5).toUpperCase()}</b><span class="tag ${o.status}">${ST[o.status]||o.status}</span></div><div class="pr">${esc(o.buyer_name||'')} · ${new Date(o.created_at).toLocaleDateString('ar')}</div><div>${(o.items||[]).map(i=>`${esc(i.n)} × ${i.q}`).join('، ')}</div><div class="pr">${o.mode==='d'?'🛵 '+esc(o.addr||''):'🏪 استلام'} · ${esc(o.pay||'')}${o.notes?' · '+esc(o.notes):''}</div><div class="row2" style="margin-top:6px"><b class="gd">${money(o.total)} ${esc(s.currency)}</b>${o.phone?`<a class="mini" href="https://wa.me/${esc(o.phone)}" target="_blank" rel="noopener">واتساب الزبون</a>`:''}</div>${o.status==='new'?`<div class="acts"><button class="mini ok" data-st="${o.id}:done">✓ تم التسليم</button><button class="mini bad" data-st="${o.id}:cancelled">إلغاء</button></div>`:''}</div>`).join(''):'<div class="empty">لا توجد طلبات بعد. شارك رابط متجرك لتصلك أول طلبية.</div>')}
 else if(SS==='products'){const pp=await DB.sel('products',{store_id:s.id}),e=pp.find(x=>x.id===EDIT)||{},f=(id,l,v,x='')=>`<label class="lbl">${l}</label><input id="${id}" value="${esc(v??'')}" ${x}>`;
  h=`<h2>${e.id?'تعديل منتج':'أضف منتجاً'}</h2><div class="card">${f('pi','أيقونة (إيموجي) أو رابط صورة',e.icon||'🍰')}${f('pn','اسم المنتج',e.name)}<div class="row"><div>${f('pp','السعر',e.price,'inputmode="decimal"')}</div><div>${f('po','السعر قبل الخصم',e.old_price,'inputmode="decimal"')}</div></div>${f('pd','وصف قصير',e.description)}<button class="btn" id="psave" style="margin-top:12px">حفظ المنتج</button>${e.id?'<button class="btn ghost" data-pcancel="1" style="margin-top:8px">إلغاء</button>':''}</div><h2>منتجاتك (${pp.length})</h2>`+pp.map(p=>`<div class="card pi"><div class="th">${ic(p.icon)}</div><div class="g"><div class="nm">${esc(p.name)}${p.sold_out?' (نفد)':''}</div><div class="pr">${money(p.price)} ${esc(s.currency)}</div></div><div class="acts" style="width:100%"><button class="mini" data-so="${p.id}">${p.sold_out?'متوفر':'نفد'}</button><button class="mini" data-pe="${p.id}">تعديل</button><button class="mini bad" data-pd="${p.id}">حذف</button></div></div>`).join('')}
 else h=storeForm(s);
 app.innerHTML=hdr(esc(s.name))+`<div class="pad"><div class="chips">${[['orders','الطلبات'],['products','المنتجات'],['settings','الإعدادات']].map(([k,t])=>`<button class="chip ${k===SS?'on':''}" data-ss="${k}">${t}</button>`).join('')}</div>${h}</div>`}

/* ===== المشتري ===== */
async function buy(){
 if(!U)return needLogin('سجّل دخولك لترى طلباتك وتقيّم المتاجر');
 const[os,rv]=await Promise.all([DB.sel('orders',{buyer:U.id}),DB.sel('reviews',{buyer:U.id})]);os.sort(desc);
 const pend=CART.sid&&Object.keys(CART.q).length;
 app.innerHTML=hdr('طلباتي')+`<div class="pad">${pend?`<div class="card" style="margin-bottom:10px"><b>لديك سلة غير مكتملة</b><button class="btn ghost" data-open="${CART.sid}" style="margin-top:8px">أكمل الطلب</button></div>`:''}`+(os.length?os.map(o=>{const r=rv.find(x=>x.order_id===o.id);return`<div class="card" style="margin-bottom:10px"><div class="row2"><b>${esc(o.store_name||'')}</b><span class="tag ${o.status}">${ST[o.status]||o.status}</span></div><div class="pr">#${String(o.id).slice(0,5).toUpperCase()} · ${new Date(o.created_at).toLocaleDateString('ar')}</div><div>${(o.items||[]).map(i=>`${esc(i.n)} × ${i.q}`).join('، ')}</div><div class="gd">${money(o.total)}</div>${o.status==='done'&&!r?`<button class="btn ghost" data-rate="${o.id}:${o.store_id}" style="margin-top:8px">قيّم تجربتك</button>`:r?`<div class="gd">${stars(r.rating)}</div>`:''}</div>`}).join(''):'<div class="empty">لم تطلب شيئاً بعد. تصفح المتاجر من الرئيسية.</div>')+'</div>'}
function rateSheet(){$('sh').innerHTML=`<div class="sheet"><div><h2 style="margin-top:0">كيف كانت تجربتك؟</h2><div class="stars row2" style="justify-content:center">${[1,2,3,4,5].map(i=>`<button data-star="${i}" class="${i<=RS.r?'on':''}">★</button>`).join('')}</div><input id="rc" placeholder="اكتب رأيك (اختياري)" style="margin:12px 0"><button class="btn" id="rsend">إرسال التقييم</button><button class="btn ghost" data-close="1" style="margin-top:10px">لاحقاً</button></div></div>`}

/* ===== أنا ===== */
function authView(){app.innerHTML=hdr('حسابي')+`<div class="pad"><div class="card"><div class="chips"><button class="chip ${AUTH==='in'?'on':''}" data-au="in">دخول</button><button class="chip ${AUTH==='up'?'on':''}" data-au="up">حساب جديد</button></div>${AUTH==='up'?'<label class="lbl">الاسم</label><input id="an">':''}<label class="lbl">البريد الإلكتروني</label><input id="ae" type="email" dir="ltr"><label class="lbl">كلمة المرور</label><input id="ap" type="password" dir="ltr"><button class="btn" id="auth" style="margin-top:14px">${AUTH==='up'?'إنشاء الحساب':'دخول'}</button></div>${demo?'<div class="empty">وضع تجريبي: البيانات محفوظة على جوالك فقط. اربط Supabase لتصير المنصة حقيقية ويشوفها الجميع.</div>':''}</div>`}
async function me(){
 if(!U)return authView();
 const[[mine],bo,br]=await Promise.all([DB.sel('stores',{owner:U.id}),DB.sel('orders',{buyer:U.id}),DB.sel('reviews',{buyer:U.id})]);
 let h=`<div class="card"><b>${esc(U.name)}</b><div class="pr">${esc(U.email||'')}</div></div><h2>🏪 كبائع</h2>`+(mine?await sellerKpi(mine):'<div class="empty">لم تفتح متجراً بعد.<br><br><button class="btn" data-tab="sell">افتح متجرك</button></div>');
 const live=bo.filter(o=>o.status!=='cancelled'),by={};live.forEach(o=>{const k=o.store_id||o.store_name;(by[k]=by[k]||{n:o.store_name,id:o.store_id,t:0,c:0});by[k].t+=+o.total||0;by[k].c++});
 const rows=Object.values(by).sort((a,b)=>b.t-a.t),mx=rows[0]?rows[0].t:1;
 h+=`<h2>🛒 كمشتري</h2><div class="kpi">${[['💸',money(sum(live,o=>o.total)),'أنفقت'],['📦',live.length,'طلب'],['⭐',br.length?(sum(br,x=>x.rating)/br.length).toFixed(1):'—','متوسط تقييمي']].map(([i,v,l])=>`<div class="card"><div>${i}</div><b>${v}</b><span class="pr">${l}</span></div>`).join('')}</div>`+
 (rows.length?'<div class="card" style="margin-top:8px">'+rows.map(r=>{const my=br.filter(x=>x.store_id===r.id),a=my.length?sum(my,x=>x.rating)/my.length:0;return`<div style="margin:10px 0"><div class="row2"><span>${esc(r.n)}</span><b>${money(r.t)}</b></div><div class="bar"><i style="width:${Math.max(6,r.t/mx*100)}%"></i></div><div class="pr">${r.c} طلب · ${a?`<span class="gd">${stars(a)}</span> رضاي عن المتجر`:'لم تقيّم بعد'}</div></div>`}).join('')+'</div>':'<div class="empty">ستظهر هنا مصاريفك ورضاك عن كل متجر.</div>');
 h+=`<h2>الإعدادات</h2><button class="btn ghost" id="tg">${theme==='dark'?'☀️ الوضع النهاري':'🌙 الوضع الليلي'}</button><button class="btn ghost" data-out="1" style="margin-top:10px">تسجيل الخروج</button>`;
 app.innerHTML=hdr('أنا')+`<div class="pad">${h}</div>`}

/* ===== الأحداث ===== */
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k)OS[k]=e.target.value;if(e.target.id==='hq'){F.q=e.target.value.trim();drawHome()}});
document.addEventListener('click',async e=>{
 if(e.target.classList&&e.target.classList.contains('sheet')){$('sh').innerHTML='';return}
 const t=e.target.closest('button,[data-open]');if(!t)return;const D=t.dataset;
 try{
  if(D.tab){TAB=D.tab;VIEW=null;render();scrollTo(0,0)}
  else if(D.open){VIEW=D.open;render();scrollTo(0,0)}
  else if(D.back){VIEW=null;render()}
  else if(D.cat!=null){F.cat=D.cat;drawHome()}
  else if(D.a!=null){CART.q[D.a]=(CART.q[D.a]||0)+1;drawStore();if(D.s)cartSheet()}
  else if(D.m!=null){if(CART.q[D.m]){CART.q[D.m]--;if(!CART.q[D.m])delete CART.q[D.m]}drawStore();if(D.s)cartSheet()}
  else if(D.sheet)cartSheet();
  else if(D.close)$('sh').innerHTML='';
  else if(D.mode){OS.mode=D.mode;cartSheet()}else if(D.pay){OS.pay=D.pay;cartSheet()}
  else if(t.id==='send'){t.disabled=true;await send()}
  else if(D.au){AUTH=D.au;authView()}
  else if(t.id==='auth'){const em=$('ae').value.trim(),pw=$('ap').value;
   if(AUTH==='up'){const nm=$('an').value.trim();if(!nm||!em||pw.length<6)return toast('أكمل الاسم والبريد وكلمة مرور 6 أحرف على الأقل');await DB.signUp(em,pw,nm)}else await DB.signIn(em,pw);
   U=await DB.user();if(!U)return toast('تحقق من بريدك لتفعيل الحساب ثم ادخل');render()}
  else if(D.out){await DB.signOut();U=null;render()}
  else if(t.id==='tg'){theme=theme==='dark'?'light':'dark';try{localStorage.setItem('dk-theme',theme)}catch(x){}paint();render()}
  else if(D.ss){SS=D.ss;EDIT=null;render()}
  else if(t.id==='screate'||t.id==='ssave'){const o=readStore();if(!o.name||o.whatsapp.length<8)return toast('اكتب اسم المتجر ورقم واتساب صحيح');
   if(t.id==='screate')await DB.ins('stores',{...o,owner:U.id,active:true});else await DB.upd('stores',MS.id,o);toast('تم الحفظ');render()}
  else if(D.act){await DB.upd('stores',MS.id,{active:MS.active===false});render()}
  else if(t.id==='sshare'){const u=location.origin+location.pathname+'?s='+MS.id;try{await navigator.clipboard.writeText(u);toast('تم نسخ رابط متجرك')}catch(x){prompt('انسخ الرابط:',u)}}
  else if(D.st){const[id,s]=D.st.split(':');await DB.upd('orders',id,{status:s});render()}
  else if(t.id==='psave'){const n=$('pn').value.trim(),p=+$('pp').value;if(!n||!p)return toast('اكتب اسم المنتج وسعره');
   const o={name:n,price:p,old_price:+$('po').value||null,icon:$('pi').value.trim()||'🛍️',description:$('pd').value.trim()};
   if(EDIT)await DB.upd('products',EDIT,o);else await DB.ins('products',{...o,store_id:MS.id,sold_out:false});EDIT=null;toast('تم الحفظ');render()}
  else if(D.pe){EDIT=D.pe;render();scrollTo(0,0)}else if(D.pcancel){EDIT=null;render()}
  else if(D.so){const[p]=await DB.sel('products',{id:D.so});await DB.upd('products',D.so,{sold_out:!p.sold_out});render()}
  else if(D.pd){if(confirm('حذف هذا المنتج؟')){await DB.del('products',D.pd);render()}}
  else if(D.rate){const[o,s]=D.rate.split(':');RS={o,s,r:5};rateSheet()}
  else if(D.star){RS.r=+D.star;const c=$('rc').value;rateSheet();$('rc').value=c}
  else if(t.id==='rsend'){await DB.ins('reviews',{store_id:RS.s,buyer:U.id,buyer_name:U.name,order_id:RS.o,rating:RS.r,comment:$('rc').value.trim()});$('sh').innerHTML='';toast('شكراً لتقييمك');render()}
 }catch(err){toast((err&&err.message)||'حدث خطأ');if(t)t.disabled=false}
});
(async()=>{paint();
 try{if(demo){seed();DB=localDB}else{await load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js');DB=remoteDB(supabase.createClient(CFG.url,CFG.key))}U=await DB.user()}
 catch(e){app.innerHTML='<div class="pad"><div class="empty" style="margin-top:40px">تعذّر الاتصال. تأكد من الإنترنت ومن إعدادات Supabase.</div></div>';return}
 const sid=new URLSearchParams(location.search).get('s');if(sid)VIEW=sid;
 render()})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
