<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري - متجر مصغر للواتساب</title>
    <!-- استدعاء Tailwind CSS للتصميم السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- شريط العرض العلوي -->
    <header class="bg-emerald-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold"><i class="fa-solid fa-store ml-2"></i>متجري السريع</h1>
        <button onclick="toggleView()" id="viewToggleBtn" class="bg-emerald-700 hover:bg-emerald-800 px-3 py-1.5 rounded-lg text-sm font-semibold transition">
            <i class="fa-solid fa-user-gear ml-1"></i> لوحة التاجر
        </button>
    </header>

    <!-- المحتوى الأساسي -->
    <main class="flex-grow container mx-auto p-4 max-w-md">

        <!-- قسم الزبون (عرض المتجر) -->
        <div id="customerView" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                <h2 class="text-lg font-bold text-gray-900">حلويات أم أحمد</h2>
                <p class="text-sm text-gray-500">اختر طلبك وسيتم إرساله مباشرة عبر واتساب</p>
                <!-- رقم واتساب التاجر (يمكن تغييره) -->
                <input type="hidden" id="merchantPhone" value="963900000000">
            </div>

            <!-- قائمة المنتجات للزبون -->
            <div id="customerProductsList" class="space-y-3">
                <!-- يتم تعبئتها تلقائياً عبر JavaScript -->
            </div>

            <!-- زر إتمام الطلب -->
            <div id="cartSection" class="bg-white p-4 rounded-xl shadow-lg border border-emerald-100 sticky bottom-4">
                <div class="flex justify-between items-center mb-3">
                    <span class="font-bold text-gray-700">المجموع الكلي:</span>
                    <span id="totalPrice" class="text-lg font-bold text-emerald-600">0$</span>
                </div>
                <button onclick="sendOrderToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-xl"></i> إرسال الطلب عبر واتساب
                </button>
            </div>
        </div>

        <!-- قسم التاجر (إدارة المنتجات) -->
        <div id="merchantView" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold text-gray-900 mb-3"><i class="fa-solid fa-plus-circle text-emerald-600 ml-1"></i> إضافة منتج جديد</h2>
                <form id="addProductForm" onsubmit="addProduct(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">اسم المنتج</label>
                        <input type="text" id="pName" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="مثال: كنافة بالجبنة">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">السعر ($)</label>
                        <input type="number" id="pPrice" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="10">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-sm transition">حفظ وإضافة المنتج</button>
                </form>
            </div>

            <!-- قائمة إدارة منتجات التاجر -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <h3 class="font-bold text-gray-800 mb-3">إدارة المنتجات الحالية</h3>
                <div id="merchantProductsList" class="space-y-2">
                    <!-- يتم تعبئتها تلقائياً عبر JavaScript -->
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript لتشغيل المنطق -->
    <script>
        // جلب المنتجات من ذاكرة الهاتف أو البدء بمنتجات افتراضية
        let products = JSON.parse(localStorage.getItem('store_products')) || [
            { id: 1, name: 'كنافة', price: 10, available: true },
            { id: 2, name: 'بقلاوة', price: 8, available: true }
        ];

        let cart = {}; // تخزين الكميات لكل منتج حسب الـ id
        let isMerchantMode = false;

        // تبديل العرض بين الزبون والتاجر
        function toggleView() {
            isMerchantMode = !isMerchantMode;
            const customerView = document.getElementById('customerView');
            const merchantView = document.getElementById('merchantView');
            const btn = document.getElementById('viewToggleBtn');

            if (isMerchantMode) {
                customerView.classList.add('hidden');
                merchantView.classList.remove('hidden');
                btn.innerHTML = '<i class="fa-solid fa-store ml-1"></i> عرض المتجر';
                btn.className = "bg-emerald-700 hover:bg-emerald-800 px-3 py-1.5 rounded-lg text-sm font-semibold transition";
                renderMerchantProducts();
            } else {
                merchantView.classList.add('hidden');
                customerView.classList.remove('hidden');
                btn.innerHTML = '<i class="fa-solid fa-user-gear ml-1"></i> لوحة التاجر';
                btn.className = "bg-emerald-700 hover:bg-emerald-800 px-3 py-1.5 rounded-lg text-sm font-semibold transition";
                renderCustomerProducts();
            }
        }

        // حفظ المنتجات في الذاكرة المحلية
        function saveProducts() {
            localStorage.setItem('store_products', JSON.stringify(products));
        }

        // إضافة منتج جديد (للتاجر)
        function addProduct(e) {
            e.preventDefault();
            const name = document.getElementById('pName').value;
            const price = parseFloat(document.getElementById('pPrice').value);

            const newProduct = {
                id: Date.now(),
                name: name,
                price: price,
                available: true
            };

            products.push(newProduct);
            saveProducts();
            document.getElementById('addProductForm').reset();
            renderMerchantProducts();
            renderCustomerProducts();
        }

        // حذف منتج
        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            saveProducts();
            renderMerchantProducts();
            renderCustomerProducts();
        }

        // تبديل حالة التوفر (متوفر / نفذت الكمية)
        function toggleAvailability(id) {
            const product = products.find(p => p.id === id);
            if (product) {
                product.available = !product.available;
                saveProducts();
                renderMerchantProducts();
                renderCustomerProducts();
            }
        }

        // عرض المنتجات لواجهة التاجر
        function renderMerchantProducts() {
            const list = document.getElementById('merchantProductsList');
            if (products.length === 0) {
                list.innerHTML = '<p class="text-xs text-gray-400 text-center py-2">لا توجد منتجات مضافة بعد.</p>';
                return;
            }
            list.innerHTML = products.map(p => `
                <div class="flex justify-between items-center p-2.5 bg-gray-50 rounded-lg border text-sm">
                    <div>
                        <span class="font-bold text-gray-800">${p.name}</span>
                        <span class="text-emerald-600 font-semibold mr-2">${p.price}$</span>
                        <span class="text-xs px-2 py-0.5 rounded ${p.available ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} mr-2">
                            ${p.available ? 'متوفر' : 'خلصت الكمية'}
                        </span>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="toggleAvailability(${p.id})" class="text-xs px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                        <button onclick="deleteProduct(${p.id})" class="text-xs px-2 py-1 bg-red-100 text-red-600 hover:bg-red-200 rounded">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // عرض المنتجات لواجهة الزبون
        function renderCustomerProducts() {
            const list = document.getElementById('customerProductsList');
            if (products.length === 0) {
                list.innerHTML = '<div class="bg-white p-6 rounded-xl text-center text-gray-400">لا توجد منتجات متاحة حالياً.</div>';
                return;
            }
            list.innerHTML = products.map(p => `
                <div class="bg-white p-3.5 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-gray-800">${p.name}</h3>
                        <p class="text-emerald-600 font-bold text-sm">${p.price}$</p>
                    </div>
                    <div>
                        ${p.available ? `
                            <div class="flex items-center gap-2">
                                <button onclick="updateQty(${p.id}, -1)" class="w-7 h-7 bg-gray-100 hover:bg-gray-200 rounded-lg font-bold text-gray-600">-</button>
                                <span id="qty-${p.id}" class="font-bold text-sm w-4 text-center">${cart[p.id] || 0}</span>
                                <button onclick="updateQty(${p.id}, 1)" class="w-7 h-7 bg-emerald-100 text-emerald-700 hover:bg-emerald-200 rounded-lg font-bold">+</button>
                            </div>
                        ` : `
                            <span class="text-xs text-red-500 font-semibold bg-red-50 px-2 py-1 rounded">نفذت الكمية</span>
                        `}
                    </div>
                </div>
            `).join('');
            calculateTotal();
        }

        // تحديث كمية المنتج في السلة
        function updateQty(id, change) {
            if (!cart[id]) cart[id] = 0;
            cart[id] += change;
            if (cart[id] < 0) cart[id] = 0;
            
            const qtyElement = document.getElementById(`qty-${id}`);
            if (qtyElement) qtyElement.innerText = cart[id];
            
            calculateTotal();
        }

        // حساب المجموع الكلي
        function calculateTotal() {
            let total = 0;
            for (let id in cart) {
                const product = products.find(p => p.id == id);
                if (product) {
                    total += product.price * cart[id];
                }
            }
            document.getElementById('totalPrice').innerText = total + '$';
        }

        // توليد رسالة واتساب مرتبة وإرسالها
        function sendOrderToWhatsApp() {
            let orderItems = [];
            let total = 0;

            for (let id in cart) {
                if (cart[id] > 0) {
                    const product = products.find(p => p.id == id);
                    if (product) {
                        let itemTotal = product.price * cart[id];
                        total += itemTotal;
                        orderItems.push(`- ${product.name} × ${cart[id]} = ${itemTotal}$`);
                    }
                }
            }

            if (orderItems.length === 0) {
                alert('الرجاء اختيار منتج واحد على الأقل قبل إرسال الطلب.');
                return;
            }

            // بناء نص الرسالة المنسق
            let message = `📋 *طلب جديد من المتجر:*\n\n`;
            message += orderItems.join('\n');
            message += `\n\n💰 *المجموع الكلي:* ${total}$`;
            message += `\n\n📍 العنوان: (أكتب عنوانك هنا)`;

            // رقم التاجر
            const merchantPhone = document.getElementById('merchantPhone').value;
            
            // فتح رابط واتساب
            const whatsappUrl = `https://wa.me/${merchantPhone}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        // تشغيل عرض المنتجات عند فتح التطبيق أول مرة
        renderCustomerProducts();
    </script>
</body>
</html>
