<input id=n placeholder="اسمك (للحساب الجديد فقط)"><input id=em type=email placeholder="البريد الإلكتروني"><input id=pw type=password placeholder="كلمة المرور (6 أحرف على الأقل)">

async function auth(up){
  const email=$('#em')?.value.trim(),password=$('#pw')?.value||'',msg=$('#authMsg');
  if(!email||!email.includes('@')){if(msg)msg.textContent='اكتب بريداً إلكترونياً صحيحاً';return}
  if(password.length<6){if(msg)msg.textContent='كلمة المرور يجب أن تكون 6 أحرف على الأقل';return}
  const btn=$(up?'#signupBtn':'#loginBtn');if(btn){btn.disabled=true;btn.textContent='جاري التنفيذ…'}if(msg)msg.textContent='';
  try{
    const r=up?await sb.auth.signUp({email,password,options:{data:{name:$('#n')?.value.trim()||''}}}):await sb.auth.signInWithPassword({email,password});
    if(r.error){if(msg)msg.textContent='تعذر التنفيذ: '+r.error.message;return}
    const session=r.data?.session||(await sb.auth.getSession()).data?.session;
    const verified=(await sb.auth.getUser()).data?.user;
    if(!session||!verified){
      if(msg)msg.textContent=up?'تم إنشاء الحساب فقط. افتح رسالة التأكيد في بريدك، ثم اضغط «دخول».':'لم يتم تسجيل الدخول فعلياً. تحقق من البريد وكلمة المرور ثم حاول مجدداً.';

  }catch(e){if(msg)msg.textContent='تعذر الاتصال. تحقق من الإنترنت وحاول مجدداً.'}
  finally{if(btn){btn.disabled=false;btn.textContent=up?'إنشاء حساب جديد':'دخول'}}
}
sb.auth.onAuthStateChange((ev,s)=>{const id=s?.user?.id||null,was=S.user?.id||null;if(id&&id!==was){const guest=loadFavs();const mine=(()=>{try{return JSON.parse(localStorage.getItem('dkf_'+id)||'[]')}catch(e){return []}})();localStorage.setItem('dkf_'+id,JSON.stringify([...new Set([...mine,...guest])]));localStorage.removeItem('dkf_guest')}S.user=s?.user||null;if(id!==was){S.favs=loadFavs();if(!booting){if(id&&S.returnToCheckout){S.returnToCheckout=false;checkout()}else render()}}});

function homeMarkup(data,products,stale=false){const cats=[...new Set((data||[]).map(s=>String(s.category||'').trim()).filter(Boolean))].slice(0,12);return hero()+`<div class=search-wrap><input id=q placeholder="ابحث عن منتج، متجر، مدينة أو قسم..." value="${E(Q)}" oninput="Q=this.value;filterMarket()"></div><div class=section-title><h3>تصفح حسب الفئة</h3><span>${cats.length} فئات</span></div><div class=category-scroll id=categories><button data-category="" class="category-chip ${!CAT?'active':''}" onclick="setCat('')">الكل</button>${cats.map(c=>`<button data-category="${E(c)}" class="category-chip ${CAT===c?'active':''}" onclick="setCat('${E(c)}')">${E(c)}</button>`).join('')}</div><div class=c style="padding:10px;margin:8px 0"><div class=row><select id=sort onchange="SORT=this.value;filterMarket()"><option value=newest ${SORT==='newest'?'selected':''}>الأحدث</option><option value=priceAsc ${SORT==='priceAsc'?'selected':''}>السعر: من الأرخص</option><option value=priceDesc ${SORT==='priceDesc'?'selected':''}>السعر: من الأغلى</option><option value=featured ${SORT==='featured'?'selected':''}>المميزة أولاً</option></select><span class=m style="white-space:nowrap">ترتيب المنتجات</span></div><div class=row><input type=number inputmode=decimal placeholder="أقل سعر" value="${E(MIN_PRICE)}" oninput="MIN_PRICE=this.value;filterMarket()"><input type=number inputmode=decimal placeholder="أعلى سعر" value="${E(MAX_PRICE)}" oninput="MAX_PRICE=this.value;filterMarket()"></div></div><div id=marketSections></div><div class=section-title><h3 id=catTitle>${CAT?`متاجر ${E(CAT)}`:'متاجر تستحق الاكتشاف'}</h3><span id=count>${(data||[]).length} متجر</span></div><div id=l></div><section class="c action-panel"><h3>عندك مشروع؟</h3><p class=m>نظّم مبيعاتك، اعرض منتجاتك، واستقبل طلباتك من مكان واحد.</p><button class=b onclick="go('sell')">＋ أضف متجرك</button></section>${cartBar()}${stale?'<div class="m" style="text-align:center;margin:8px">يتم تحديث السوق…</div>':''}`}
function applyHomeData(data,products){(data||[]).forEach(s=>S.stores[s.id]=s);(products||[]).forEach(p=>S.prods[p.id]=p)}
async function home(a){
  const cached=readHomeCache();
  if(cached){applyHomeData(cached.stores,cached.products);a.innerHTML=homeMarkup(cached.stores,cached.products,true);renderMarket(cached.products);filterStores()}
  else {a.innerHTML=homeMarkup([],[]);$('#marketSections').innerHTML='<div class="c empty">جاري تحميل المنتجات والمتاجر…</div>';$('#l').innerHTML='<div class="c empty">جارٍ تجهيز السوق…</div>'}
  if(homeSnapshot&&Date.now()-homeSnapshotAt<60000){
    applyHomeData(homeSnapshot.stores,homeSnapshot.products);
    if(S.tab==='home'){a.innerHTML=homeMarkup(homeSnapshot.stores,homeSnapshot.products);renderMarket(homeSnapshot.products);filterStores()}
    return;
  }
  if(!homeRequest)homeRequest=Promise.all([
    sb.from('dk_stores').select('id,slug,name,descr,city,category,currency,delivery,min_order,hours,created_at,logo_url,cover_url,theme_color,status').in('status',['published']).order('created_at',{ascending:false}).limit(40),
    sb.from('dk_products').select('id,store_id,name,description,price,old_price,stock,featured,available,image,images,unit,created_at').order('created_at',{ascending:false}).limit(24)
  ]).then(([stores,products])=>({stores,products}));
  const request=homeRequest;
  let result;
  try{result=await request}finally{if(homeRequest===request)homeRequest=null}
  const {data,error}=result.stores;
  const {data:products,error:productsError}=result.products;
  if(error){if(!cached){a.innerHTML='<div class="c empty">تعذّر تحميل السوق حالياً.<br><button class="b" onclick="retryHome()">إعادة المحاولة</button></div>';return}console.warn('تعذر تحديث المتاجر',error);return}
  homeSnapshot={stores:data||[],products:products||[]};homeSnapshotAt=Date.now();
  applyHomeData(data||[],products||[]);writeHomeCache(data||[],products||[]);
  if(S.tab==='home'){a.innerHTML=homeMarkup(data||[],products||[]);renderMarket(products||[]);filterStores()}
  if(productsError)console.warn('تعذر تحميل المنتجات العامة',productsError);
}

</div>${similar.length?`<div class=section-title><h3>منتجات مشابهة من المتجر</h3></div><div class=market-strip>${similar.map(productCard).join('')}</div>`:''}${cartBar()}`}

function renderMarket(products){const q=Q.trim().toLowerCase();let list=products.filter(p=>{const s=S.stores[p.store_id],price=+p.price||0;return s&&(!CAT||String(s.category||'')===CAT)&&(!q||[p.name,p.description,s.name,s.city,s.category].join(' ').toLowerCase().includes(q))&&(!MIN_PRICE||price>=+MIN_PRICE)&&(!MAX_PRICE||price<=+MAX_PRICE)});if(SORT==='priceAsc')list.sort((a,b)=>(+a.price||0)-(+b.price||0));if(SORT==='priceDesc')list.sort((a,b)=>(+b.price||0)-(+a.price||0));if(SORT==='featured')list.sort((a,b)=>Number(b.featured)-Number(a.featured));const featured=list.filter(p=>p.featured),offers=list.filter(p=>p.old_price&&+p.old_price>+p.price);$('#marketSections').innerHTML=marketSection('منتجات مميزة',featured)+marketSection('عروض حالية',offers)+marketSection(CAT?`أحدث منتجات ${CAT}`:'أحدث المنتجات',list)}

function setCat(category){CAT=category;document.querySelectorAll('.category-chip').forEach(b=>b.classList.toggle('active',b.dataset.category===CAT));const title=$('#catTitle');if(title)title.textContent=CAT?`متاجر ${CAT}`:'متاجر تستحق الاكتشاف';filterMarket()}
function open_(id){S.store=S.stores[id];S.tab='store';render();scrollTo(0,0);trackVisit(id)}
async function trackVisit(storeId){
  if(!storeId)return;
  try{
    // try RPC then fallbacks
    const tries=[
      ()=>sb.rpc('track_visit',{sid:storeId}),
      ()=>sb.rpc('track_visit',{store_id:storeId}),
    ];
    for(const t of tries){
      try{const {error}=await t(); if(!error)return}catch(e){}
    }
  }catch(e){}
}

const UNITS=['قطعة','كيلو','ليتر','علبة','دزينة'];
const stepOf=u=>(u==='كيلو'||u==='ليتر')?0.5:1;
const rnd=n=>Math.round(n*100)/100;
function imgs(x){return (x.images&&x.images.length)?x.images:(x.image?[x.image]:[])}
function gal(x){const a=imgs(x);if(!a.length)return '';return a.length===1?`<img src="${E(a[0])}" alt="" loading="lazy" onclick="zoomImg(this)" style="cursor:zoom-in">`:`<div class=gal>${a.map(u=>`<img src="${E(u)}" alt="" loading="lazy" onclick="zoomImg(this)" style="cursor:zoom-in">`).join('')}</div>`}
function zoomImg(el){
  const box=el.closest('.gal')||el.parentElement;
  const list=[...box.querySelectorAll('img')].map(i=>i.currentSrc||i.src);
  let k=Math.max(0,list.indexOf(el.currentSrc||el.src)),x0=0;
  const o=document.createElement('div');o.id='lb';
  o.innerHTML='<button class="lbx" aria-label="إغلاق">✕</button>'+(list.length>1?'<button class="lbn lbp" aria-label="السابق">›</button><button class="lbn lbq" aria-label="التالي">‹</button><div class="lbc"></div>':'')+'<img alt="">';
  const im=o.querySelector('img'),ct=o.querySelector('.lbc');
  const show=()=>{im.src=list[k];if(ct)ct.textContent=(k+1)+' / '+list.length};
  const go=d=>{k=(k+d+list.length)%list.length;show()};
  const kd=e=>{if(e.key==='Escape')close();if(e.key==='ArrowLeft')go(1);if(e.key==='ArrowRight')go(-1)};
  const close=()=>{o.remove();document.removeEventListener('keydown',kd)};
  o.onclick=e=>{if(e.target===o||e.target.classList.contains('lbx'))close()};
  const nx=o.querySelector('.lbq'),pv=o.querySelector('.lbp');
  if(nx){nx.onclick=e=>{e.stopPropagation();go(1)};pv.onclick=e=>{e.stopPropagation();go(-1)}}
  o.addEventListener('touchstart',e=>{x0=e.changedTouches[0].clientX},{passive:true});
  o.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(list.length>1&&Math.abs(d)>50)go(d<0?1:-1)},{passive:true});
  document.addEventListener('keydown',kd);
  show();document.body.appendChild(o);
}
function cartInfo(){return {n:S.cart.length,sum:rnd(S.cart.reduce((n,i)=>n+i.q*i.price,0))}}
function cartBar(){const s=S.stores[S.cartStore]||S.store;if(!S.cart.length||!s)return '';const {n,sum}=cartInfo();return `<div class=cb><span style="flex:1">${n} منتج — ${sum} ${E(s.currency||'')}</span><button class=b onclick="checkout()">إتمام الطلب</button></div>`}
function setQ(id,v){v=+v;const i=S.cart.find(x=>x.id===id),p=S.prods[id];if(!i)return;if(!(v>0))S.cart=S.cart.filter(x=>x.id!==id);else {if(p&&p.stock>0&&v>+p.stock)return alert(`المتاح من ${p.name} هو ${p.stock} فقط`);i.q=rnd(v)}if(!S.cart.length)return render();checkout()}

${n?`<div class=cb><span style="flex:1">${n} منتج — ${sum} ${E(s.currency)}</span><button class=b onclick="checkout()">إتمام الطلب</button></div>`:''}`;

function add(id){
  const p=S.prods[id];if(!p||p.available===false)return alert('هذا المنتج غير متوفر حالياً');if(!S.store)S.store=S.stores[p.store_id];if(S.cartStore!==S.store.id){S.cart=[];S.cartStore=S.store.id}
  const u=p.unit||'قطعة',stp=stepOf(u),i=S.cart.find(x=>x.id===id),next=rnd((i?.q||0)+stp);if(p.stock>0&&next>+p.stock)return alert(`المتاح من ${p.name} هو ${p.stock} فقط`);i?i.q=next:S.cart.push({id,name:p.name,price:+p.price,q:stp,unit:u});render();
}
function shareUrl(slug){return location.origin+location.pathname+'?s='+encodeURIComponent(slug)}
async function share(slug){
  const url=shareUrl(slug);
  try{await navigator.clipboard.writeText(url);alert('✅ تم نسخ الرابط')}
  catch(e){
    const t=document.createElement('textarea');t.value=url;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(_){}
    t.remove();
    if(ok)alert('✅ تم نسخ الرابط');else prompt('انسخ الرابط:',url);
  }
}

async function send(){
  if(!S.user){alert('انتهت جلسة الدخول. سجّل الدخول ثم أعد إرسال الطلب');S.tab='buy';render();return}
  if(S.sending)return alert('جاري إرسال الطلب، انتظر لحظة');

  if(sum<+s.min_order)return alert('أقل قيمة للطلب هي '+s.min_order+' '+s.currency);
  const nm=$('#bn').value.trim(),ph=$('#bp').value.trim(),ad=$('#ba').value.trim(),dv=$('#bd').value,br=$('#bb').value.trim(),pay=$('#bpay').value==='sham'?'شام كاش':'الدفع عند الاستلام';

  if(dv==='branch'&&!br)return alert('اكتب اسم فرع الشحن والمدينة');
  const recv=dv==='home'?'توصيل للبيت — '+ad:'فرع شحن — '+br+(ad?' — '+ad:''),full=recv+' | الدفع: '+pay;
  const wa=String(s.whatsapp||'').replace(/\D/g,'');
  if(wa.length<8)return alert('رقم واتساب المتجر غير موجود أو غير صحيح. عدّل بيانات المتجر ثم أعد المحاولة');
  const items=S.cart.map(i=>({name:i.name,price:i.price,q:i.q,unit:i.unit||'قطعة'}));
  S.sending=true;

function closePostModal(){const m=document.getElementById('postModal');if(m)m.classList.remove('on')}
function openPostModal(){const m=document.getElementById('postModal');if(m)m.classList.add('on')}
function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines=5){
  const words=String(text||'').split(/\s+/);let line='',lines=[];
  for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=w}else line=test}
  if(line)lines.push(line);
  const use=lines.slice(0,maxLines);
  use.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lineHeight));
  return use.length;
}
function loadImageSafe(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>resolve(img);
    img.onerror=()=>reject(new Error('img'));
    img.src=src;
  });
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function buildCaption(p,st,style){
  const city=st.city?` في ${st.city}`:'';
  const link=shareUrl(st.slug);
  const tags=['#دكانك','#تسوق_محلي','#سوريا'];
  if(st.city)tags.push('#'+String(st.city).replace(/\s+/g,'_'));
  if(st.category)tags.push('#'+String(st.category).replace(/\s+/g,'_'));
  const hasDiscount=p.old_price&&+p.old_price>+p.price;
  const discount=hasDiscount?Math.round((1-(+p.price/+p.old_price))*100):0;
  if(style==='offer'|| (style==='auto'&&hasDiscount)){
    return [
      `🔥 عرض خاص`,
      `${p.name}`,
      hasDiscount?`قبل: ${p.old_price}  ←  الآن: ${p.price} ${st.currency||''} (خصم ${discount}%)`:`💰 ${p.price} ${st.currency||''}`,
      p.description?`📝 ${String(p.description).slice(0,110)}`:'',
      `🏪 ${st.name}${city}`,
      `📲 اطلب الآن على واتساب`,
      link?`🔗 ${link}`:'',
      '',
      tags.join(' ')+' #عرض #تخفيض'
    ].filter(Boolean).join('\n');
  }
  if(style==='new'){
    return [
      `🆕 وصل حديثاً`,
      `${p.name}`,
      `💰 السعر: ${p.price} ${st.currency||''}`,
      p.description?`📝 ${String(p.description).slice(0,110)}`:'',
      `🏪 ${st.name}${city}`,
      `📲 للطلب راسلنا على واتساب`,
      link?`🔗 ${link}`:'',
      '',
      tags.join(' ')+' #جديد #وصل_اليوم'
    ].filter(Boolean).join('\n');
  }
  // default
  return [
    `✨ ${p.name}`,
    `💰 السعر: ${p.price} ${st.currency||''}`+(hasDiscount?` (بدلاً من ${p.old_price})`:''),
    p.description?`📝 ${String(p.description).slice(0,120)}`:'',
    `🏪 ${st.name}${city}`,
    `📲 للطلب راسلنا على واتساب`,
    link?`🔗 ${link}`:'',
    '',
    tags.join(' ')
  ].filter(Boolean).join('\n');
}
async function drawPostCanvas(p,st){
  const canvas=document.getElementById('postCanvas');
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  const theme=st.theme_color||'#0a827b';
  // background
  const grd=ctx.createLinearGradient(0,0,W,H);
  grd.addColorStop(0, theme);
  grd.addColorStop(1, '#062e2c');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  // decor
  ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(-100,H-80,320,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(W+80,80,260,0,Math.PI*2);ctx.stroke();
  // top bar
  ctx.fillStyle='rgba(243,207,117,.97)';
  ctx.fillRect(0,0,W,100);
  ctx.fillStyle='#174442';
  ctx.textAlign='right';
  ctx.font='800 44px Tajawal, Arial';
  ctx.fillText('دكانك', W-48, 64);
  // store row
  ctx.fillStyle='#fff';
  ctx.font='700 34px Tajawal, Arial';
  ctx.fillText(st.name||'متجري', W-48, 160);
  if(st.city){
    ctx.font='600 26px Tajawal, Arial';
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.fillText(st.city, W-48, 200);
  }
  // logo circle if available
  if(st.logo_url){
    try{
      const logo=await loadImageSafe(st.logo_url);
      const lx=48, ly=130, lr=54;
      ctx.save();
      ctx.beginPath();ctx.arc(lx+lr, ly+lr, lr, 0, Math.PI*2);ctx.closePath();ctx.clip();
      ctx.fillStyle='#fff';ctx.fillRect(lx,ly,lr*2,lr*2);
      const scale=Math.max((lr*2)/logo.width,(lr*2)/logo.height);
      const iw=logo.width*scale, ih=logo.height*scale;
      ctx.drawImage(logo, lx+(lr*2-iw)/2, ly+(lr*2-ih)/2, iw, ih);
      ctx.restore();
      ctx.strokeStyle='rgba(243,207,117,.9)';ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(lx+lr, ly+lr, lr, 0, Math.PI*2);ctx.stroke();
    }catch(e){}
  }
  // product image
  const im=imgs(p)[0];
  let imgBottom=230;
  if(im){
    try{
      const img=await loadImageSafe(im);
      const box=600; const x=(W-box)/2, y=230;
      ctx.save();
      roundRect(ctx,x,y,box,box,40);ctx.clip();
      ctx.fillStyle='#0d2423';ctx.fillRect(x,y,box,box);
      const scale=Math.max(box/img.width, box/img.height);
      const iw=img.width*scale, ih=img.height*scale;
      ctx.drawImage(img, x+(box-iw)/2, y+(box-ih)/2, iw, ih);
      ctx.restore();
      // gold frame
      ctx.strokeStyle='rgba(243,207,117,.55)';ctx.lineWidth=6;
      roundRect(ctx,x,y,box,box,40);ctx.stroke();
      imgBottom=y+box+36;
    }catch(e){imgBottom=260}
  }
  // name & price
  ctx.fillStyle='#fff';
  ctx.textAlign='center';
  ctx.font='800 52px Tajawal, Arial';
  const lines=wrapText(ctx, p.name||'منتج', W/2, imgBottom+48, W-130, 60, 3);
  const priceY=imgBottom+48+lines*60+30;
  ctx.fillStyle='#f3cf75';
  ctx.font='800 58px Tajawal, Arial';
  ctx.fillText(`${p.price} ${st.currency||''}`, W/2, priceY);
  if(p.old_price && +p.old_price > +p.price){
    ctx.fillStyle='rgba(255,255,255,.72)';
    ctx.font='600 30px Tajawal, Arial';
    ctx.fillText(`بدلاً من ${p.old_price}`, W/2, priceY+42);
    const disc=Math.round((1-(+p.price/+p.old_price))*100);
    // discount badge
    ctx.fillStyle='#e11d48';
    roundRect(ctx, W/2-90, priceY+58, 180, 48, 24);
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='800 28px Tajawal, Arial';
    ctx.fillText(`خصم ${disc}%`, W/2, priceY+90);
  }
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.font='700 28px Tajawal, Arial';
  ctx.fillText('اطلب عبر واتساب', W/2, H-90);
  ctx.font='500 22px Tajawal, Arial';
  ctx.fillText('من دكانك — سوقك المحلي', W/2, H-48);
}
async function preparePost(pid, style='auto'){
  const p=S.prods[pid]||(await sb.from('dk_products').select('*').eq('id',pid).maybeSingle()).data;
  if(!p)return alert('تعذّر تحميل المنتج');
  S.prods[p.id]=p;
  let st=S.stores[p.store_id]||S.store;
  if(!st){const r=await sb.from('dk_stores').select('*').eq('id',p.store_id).maybeSingle();st=r.data;if(st)S.stores[st.id]=st}
  if(!st)return alert('تعذّر تحميل بيانات المتجر');
  await drawPostCanvas(p,st);
  const caption=buildCaption(p,st,style||'auto');
  const capEl=document.getElementById('postCaption');
  if(capEl)capEl.value=caption;
  // store current for template switching
  window.__postCtx={pid:p.id, style:style||'auto'};
  // reflect select
  const sel=document.getElementById('postStyle');
  if(sel){
    const hasDiscount=p.old_price&&+p.old_price>+p.price;
    sel.value = style==='auto' ? (hasDiscount?'offer':'default') : style;
  }
  openPostModal();
}

<label>واتساب مع رمز الدولة<input id=f3 type=tel placeholder="963991234567" value="${val('whatsapp')}"></label>
<label>المدينة والحي<input id=f4 placeholder="مثال: اللاذقية — مشروع الصليبة" value="${val('city')}"></label>
<label>القسم<input id=f5 placeholder="حلويات، ملابس، حقائب..." value="${val('category')}"></label>
<details class=form-section><summary>وصف المتجر</summary><label>وصف قصير<input id=f2 placeholder="ماذا تبيع؟" value="${val('descr')}"></label></details>
<details class=form-section><summary>إعدادات الطلب والتوصيل</summary><label>العملة<select id=f6><option ${val('currency')==='$'?'selected':''}>$</option><option ${val('currency')==='ل.س'?'selected':''}>ل.س</option><option ${val('currency')==='د.أ'?'selected':''}>د.أ</option><option ${val('currency')==='ر.س'?'selected':''}>ر.س</option></select></label><label>رسوم التوصيل<input id=f7 type=number min="0" inputmode="decimal" placeholder="0 إن لم يوجد" value="${val('delivery',0)}"></label><label>أقل قيمة للطلب<input id=f8 type=number min="0" inputmode="decimal" placeholder="0 إن لم يوجد" value="${val('min_order',0)}"></label><label>ساعات العمل<input id=f9 placeholder="مثال: 10 ص - 10 م" value="${val('hours')}"></label></details>
<details class=form-section><summary>هوية المتجر</summary><label>لون هوية المتجر<input id=f12 type=color value="${val('theme_color','#087f78')}"></label><label>شعار المتجر<input id=f10 type=file accept="image/*"></label><label>صورة الغلاف<input id=f11 type=file accept="image/*"></label></details>
<button class=b onclick="${mode==='edit'?`saveStore('${E(st.id)}')`:'mkStore()'}">${mode==='edit'?'حفظ تعديلات المتجر':'إنشاء المتجر'}</button>
${mode==='edit'?'<button class="b o" onclick="render()">إلغاء</button>':''}</div>`;
}
function editStore(id){const st=S.stores[id]||S.store;$('#app').innerHTML=hd('تعديل المتجر')+storeForm(st,'edit');scrollTo(0,0)}
async function delStore(id){
  if(!confirm('سيتم حذف المتجر وكل منتجاته وطلباته نهائيًا. هل أنت متأكد؟'))return;
  await sb.from('dk_products').delete().eq('store_id',id);
  await sb.from('dk_orders').delete().eq('store_id',id);
  const {data,error}=await sb.from('dk_stores').delete().eq('id',id).select();
  if(error)return alert('تعذّر الحذف: '+error.message);
  if(!data||!data.length)return alert('لم يُحذف المتجر. شغّل ملفات SQL في Supabase أولًا.');
  delete S.stores[id];
  if(S.store&&S.store.id===id)S.store=null;
  render();
}
async function mkStore(){
  const v=i=>$('#f'+i).value.trim(),name=v(1);
  if(!name||!v(3))return alert('اسم المتجر ورقم واتساب مطلوبان');
  const slug=(name.replace(/\s+/g,'-').replace(/[^\p{L}\p{N}-]/gu,'')||'متجر')+'-'+(100+Math.floor(Math.random()*900));
  const {data:created,error}=await sb.from('dk_stores').insert({slug,name,descr:v(2),whatsapp:v(3),city:v(4),category:v(5),currency:v(6),delivery:+v(7)||0,min_order:+v(8)||0,hours:v(9),theme_color:$('#f12').value||'#087f78',status:'pending'}).select().single();
  if(error)return alert('تعذّر إنشاء المتجر: '+error.message);
  const assets=await uploadStoreAssets(created.id);
  if(assets.error)return alert('تم إنشاء المتجر، لكن تعذّر رفع الهوية: '+assets.error);
  if(Object.keys(assets.patch).length)await sb.from('dk_stores').update(assets.patch).eq('id',created.id);
  alert('تم إنشاء متجرك وإرساله للمراجعة. سيظهر للزبائن بعد موافقة الإدارة');
  render();
}
async function saveStore(id){
  const v=i=>$('#f'+i).value.trim(),name=v(1);
  if(!name||!v(3))return alert('اسم المتجر ورقم واتساب مطلوبان');
  const assets=await uploadStoreAssets(id);
  if(assets.error)return alert('تعذّر رفع الهوية: '+assets.error);
  const {error}=await sb.from('dk_stores').update({name,descr:v(2),whatsapp:v(3),city:v(4),category:v(5),currency:v(6),delivery:+v(7)||0,min_order:+v(8)||0,hours:v(9),theme_color:$('#f12').value||'#087f78',...assets.patch}).eq('id',id).eq('owner',S.user.id);
  if(error)return alert('تعذّر حفظ تعديلات المتجر: '+error.message);
  const {data}=await sb.from('dk_stores').select('*').eq('id',id).maybeSingle();
  if(data){S.stores[id]=data;S.store=data}
  alert('تم حفظ تعديلات المتجر');
  render();
}
async function uploadStoreAssets(id){
  const patch={},files=[['f10','logo_url','logo'],['f11','cover_url','cover']];
  for(const [input,column,label] of files){const f=$('#'+input)?.files?.[0];if(!f)continue;const b=await shrink(f),path=`${S.user.id}/stores/${id}_${label}_${Date.now()}.jpg`,u=await sb.storage.from('dk-images').upload(path,b,{contentType:'image/jpeg',upsert:true});if(u.error)return {patch,error:u.error.message};patch[column]=sb.storage.from('dk-images').getPublicUrl(path).data.publicUrl}
  return {patch};
}
function shrink(f){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const r=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||f),'image/jpeg',.82)};im.onerror=()=>res(f);im.src=u})}
async function addProd(sid){
  const name=$('#pn').value.trim(),description=$('#pd').value.trim(),price=+$('#pp').value,old_price=+$('#po').value||null,stock=+$('#ps').value||0,sku=$('#pk').value.trim(),featured=$('#pfeatured').checked,unit=$('#pu').value||'قطعة',files=[...$('#pf').files].slice(0,4);
  if(!name||!(price>=0)||$('#pp').value==='')return alert('اسم المنتج والسعر مطلوبان');
  const urls=[];
  for(let k=0;k<files.length;k++){
    const b=await shrink(files[k]);
    const path=`${S.user.id}/${Date.now()}_${k}.jpg`;
    const u=await sb.storage.from('dk-images').upload(path,b,{contentType:'image/jpeg'});
    if(u.error)return alert('تعذّر رفع الصورة: '+u.error.message);
    urls.push(sb.storage.from('dk-images').getPublicUrl(path).data.publicUrl);
  }
  const {error}=await sb.from('dk_products').insert({store_id:sid,name,description,price,old_price,stock,sku,featured,available:stock>0,unit,image:urls[0]||null,images:urls});
  if(error)return alert(/column/i.test(error.message)?'شغّل ملف products.sql في Supabase أولًا':error.message);
  render();
}
function editProd(id){
  const p=S.prods[id];
  if(!p)return alert('تعذّر العثور على المنتج');
  $('#app').innerHTML=hd('تعديل المنتج')+`<div class=c>
<label>اسم المنتج<input id=epn value="${E(p.name)}"></label><label>الوصف<textarea id=epd rows=2>${E(p.description||'')}</textarea></label>
<label>السعر<input id=epp type=number inputmode=decimal step=any value="${E(p.price)}"></label>
<label>السعر القديم<input id=epo type=number inputmode=decimal step=any value="${E(p.old_price||'')}"></label><label>المخزون<input id=eps type=number min=0 inputmode=decimal step=any value="${E(p.stock??0)}"></label><label>رمز المنتج SKU<input id=epk value="${E(p.sku||'')}"></label><label class=m><input id=epfeatured type=checkbox style="width:auto;margin-left:6px" ${p.featured?'checked':''}> منتج مميز</label>
<label>الوحدة<select id=epu>${UNITS.map(u=>`<option ${u===(p.unit||'قطعة')?'selected':''}>${u}</option>`).join('')}</select></label>
<button class=b onclick="saveProd('${E(id)}','${E(p.store_id)}')">حفظ تعديلات المنتج</button>
<button class="b o" onclick="render()">إلغاء</button></div>`;
  scrollTo(0,0);
}
async function saveProd(id,sid){
  const name=$('#epn').value.trim(),description=$('#epd').value.trim(),price=+$('#epp').value,old_price=+$('#epo').value||null,stock=+$('#eps').value||0,sku=$('#epk').value.trim(),featured=$('#epfeatured').checked,unit=$('#epu').value;
  if(!name||!(price>=0)||$('#epp').value==='')return alert('اسم المنتج والسعر مطلوبان');
  const {error}=await sb.from('dk_products').update({name,description,price,old_price,stock,sku,featured,unit,available:stock>0}).eq('id',id).eq('store_id',sid);
  if(error)return alert('تعذّر حفظ المنتج: '+error.message);
  alert('تم حفظ تعديلات المنتج');
  render();
}
async function delProd(id){if(confirm('حذف المنتج؟')){await sb.from('dk_products').delete().eq('id',id);render()}}
async function setSt(id,status){const {error}=await sb.from('dk_orders').update({status}).eq('id',id);if(error)alert(error.message)}

/* ---------- المفضلة ---------- */
async function fav(a){
  if(typeof a==='string')return favToggle(a);
  const cached=S.favs.map(id=>S.stores[id]).filter(Boolean);
  const missing=S.favs.filter(id=>!S.stores[id]);
  let data=cached;
  if(missing.length){const r=await sb.from('dk_stores').select('*').in('id',missing);(r.data||[]).forEach(s=>S.stores[s.id]=s);data=[...cached,...(r.data||[])];}
  a.innerHTML=hd('المفضلة')+((data||[]).map(card).join('')||'<div class=c>لم تضف متجرًا للمفضلة بعد. اضغط ♡ داخل أي متجر.</div>');
}
function favToggle(id){S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id];localStorage.setItem(favKey(),JSON.stringify(S.favs));render()}

/* ---------- المزيد ---------- */
async function adminPanel(){
  if(!S.user)return '';
  const {data:ad}=await sb.from('dk_admins').select('user_id').eq('user_id',S.user.id).maybeSingle();
  if(!ad)return '';
  const [{data:st},{data:cm}]=await Promise.all([
    sb.from('dk_stores').select('id,name,city,slug,status').order('created_at',{ascending:false}),
    sb.from('dk_complaints').select('*').order('created_at',{ascending:false}).limit(50)]);
  return `<h3>لوحة الإدارة</h3><div class=c><b>المتاجر (${(st||[]).length})</b></div>`+
  ((st||[]).map(x=>`<div class="c"><div class=row><span style="flex:1"><b>${E(x.name)}</b><div class=m>${E(x.city||'')} — ${STORE_ST[x.status]||x.status||'غير محدد'}</div></span><button class="i" onclick="adminSetStoreStatus('${x.id}','published')" aria-label="نشر المتجر">✓</button><button class="i" onclick="adminSetStoreStatus('${x.id}','pending')" aria-label="إرجاع للمراجعة">…</button><button class="i" onclick="adminSetStoreStatus('${x.id}','suspended')" aria-label="إيقاف المتجر">×</button><button class="i" onclick="delStore('${x.id}')">${ico('trash')}</button></div></div>`).join('')||'<div class=c>لا متاجر.</div>')+
  `<div class=c><b>الرسائل والشكاوى (${(cm||[]).length})</b></div>`+
  ((cm||[]).map(x=>`<div class="c row"><span style="flex:1">${E(x.msg)}<div class=m>${x.created_at?new Date(x.created_at).toLocaleString('ar'):''}</div></span><button class="i" onclick="delMsg('${x.id}')">${ico('trash')}</button></div>`).join('')||'<div class=c>لا رسائل.</div>');
}
async function adminSetStoreStatus(id,status){const {error}=await sb.from('dk_stores').update({status}).eq('id',id);if(error)return alert('تعذّر تحديث حالة المتجر: '+error.message);if(S.stores[id])S.stores[id].status=status;render()}
async function delMsg(id){if(!confirm('حذف الرسالة؟'))return;const {error}=await sb.from('dk_complaints').delete().eq('id',id);if(error)return alert(error.message);render()}
async function more(a){
  const adm=await adminPanel();
  a.innerHTML=hd('المزيد')+(S.user?`<div class=c><b>${E(S.user.user_metadata?.name||'')}</b><div class=m>${E(S.user.email)}</div></div>`:'')+
`<button class="b o" onclick="theme()">🌓 تبديل الوضع الليلي والنهاري</button>
<div class=c><h3>مساعدة وشكوى</h3><div class=m>اكتب مشكلتك أو اقتراحك وسنقرؤه.</div><textarea id=cm rows=3 placeholder="رسالتك"></textarea><button class=b onclick="complain()">إرسال</button></div>
${S.user?'<button class="b o" onclick="sb.auth.signOut()">تسجيل الخروج</button>':''}${adm}`;
}
function theme(){const light=document.body.classList.toggle('light');localStorage.dkl=light?'1':'0';render()}
async function complain(){
  if(!S.user)return alert('سجّل دخولك أولًا من تبويب مشتري أو بائع');
  const msg=$('#cm').value.trim();if(!msg)return;
  const {error}=await sb.from('dk_complaints').insert({msg});
  alert(error?error.message:'وصلتنا رسالتك، شكرًا لك');if(!error)$('#cm').value='';
}

/* ---------- فتح رابط متجر مباشرة ---------- */
(async()=>{
  const slug=new URLSearchParams(location.search).get('s');
  const productId=new URLSearchParams(location.search).get('p');
  const deepLink=!!(slug||productId);
  S.favs=loadFavs();
  if(!deepLink)render();
  const {data:{session}}=await sb.auth.getSession();
  S.user=session?.user||null;
  S.favs=loadFavs();
  if(slug){const {data}=await sb.from('dk_stores').select('id,slug,name,descr,whatsapp,city,category,currency,delivery,min_order,hours,logo_url,cover_url,theme_color,status').eq('slug',slug).maybeSingle();if(data){S.stores[data.id]=data;S.store=data;S.tab='store'}}
  if(productId){const {data}=await sb.from('dk_products').select('id,store_id,name,description,price,old_price,stock,featured,available,image,images,unit,sku,created_at').eq('id',productId).maybeSingle();if(data){S.prods[data.id]=data;const {data:store}=await sb.from('dk_stores').select('id,slug,name,descr,whatsapp,city,category,currency,delivery,min_order,hours,logo_url,cover_url,theme_color,status').eq('id',data.store_id).maybeSingle();if(store){S.stores[store.id]=store;S.store=store}S.product=data;S.tab='product'}}
  booting=false;
  if(deepLink)render();
})();
</script>
