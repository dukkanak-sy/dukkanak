t-align:center;color:var(--muted)}nav{position:fixed;inset:auto 0 0;background:color-mix(in srgb,var(--surface) 94%,transparent);border-top:1px solid var(--line);display:flex;padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 -12px 30px rgba(13,84,79,.08);backdrop-filter:blur(14px)}nav button{flex:1;background:none;border:1px solid transparent;border-radius:18px;color:var(--muted);font:inherit;font-size:.72rem;display:grid;gap:2px;padding:6px 0;cursor:pointer;transition:.2s}nav button span{font-size:1.25rem}nav button.on{color:var(--teal);font-weight:800;border-color:#d7bf76;background:color-mix(in srgb,var(--surface) 86%,var(--gold) 14%);box-shadow:0 3px 10px rgba(211,177,83,.14)}hr{border:0;border-top:1px solid var(--line)}

<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
const SB_URL='https://ojazsslcfwiwvjsbohyc.supabase.co';
const SB_KEY='sb_publishable_MWPL0ekEy-2LuRVIbgvMUQ_94K3i6qf'; // المفتاح العام sb_publishable_...
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={new:'جديد',prep:'قيد التجهيز',done:'تم التوصيل',cancel:'ملغي'};
let S={tab:'home',user:null,store:null,cart:[],cartStore:null,prods:{},stores:{},favs:[]};
let booting=true;
function favKey(){return 'dkf_'+(S.user?S.user.id:'guest')}
function loadFavs(){try{return JSON.parse(localStorage.getItem(favKey())||'[]')}catch(e){return []}}
if(localStorage.dkl!=='0')document.body.classList.add('light');

const TABS=[['home','home','الرئيسية'],['buy','orders','مشتري'],['sell','store','بائع'],['fav','heart','المفضلة'],['more','menu','المزيد']];
function ico(n,on){const p={home:'M5 20V9l7-5 7 5v11h-5v-6H10v6H5',orders:'M6 5h12v14H6z M9 9h6 M9 13h6 M9 17h4',store:'M4 9h16v11H4z M3 9l2-5h10l2 5 M7 9v3 M12 9v3 M17 9v3',heart:'M12 20S4 15.2 4 9.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15.2 12 20 12 20z',menu:'M5 7h14 M5 12h14 M5 17h14',trash:'M5 7h14 M9 7V5h6v2 M7 7l1 13h8l1-13 M10 11v6 M14 11v6',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M4 12h2 M18 12h2 M12 4v2 M12 18v2'};return `<svg class="nav-ico${on?' on':''}" viewBox="0 0 24 24" aria-hidden="true"><path d="${p[n]||p.home}"/></svg>`;}
function go(t){S.tab=t;render();scrollTo(0,0)}
async function render(){
  $('#nav').innerHTML=TABS.map(([k,i,n])=>`<button class="${S.tab===k||(S.tab==='store'&&k==='home')?'on':''}" onclick="go('${k}')"><span>${ico(i)}</span>${n}</button>`).join('');
  const a=$('#app');
  try{await ({home,buy,sell,fav,more,store:storeView}[S.tab])(a)}catch(e){a.innerHTML=`<div class=c>تعذّر التحميل: ${E(e.message)}</div>`}
}
const logoMark=()=>`<svg viewBox="0 0 48 48" aria-label="شعار دكانك"><path fill="currentColor" d="M8 20h32v21H8z" opacity=".22"/><path fill="currentColor" d="M6 17h36l-3-9H9z"/><path fill="#fff" d="M10 19h28v20H10z"/><path fill="currentColor" d="M13 23h8v16h-8zm12 0h8v16h-8z" opacity=".9"/><path fill="#f3cf75" d="M6 17h36v5H6z"/></svg>`;
const hd=t=>`<div class=h><div class=logo>${logoMark()}</div><h2>${t}</h2></div>`;
const hero=()=>`<section class=hero><div class=appbar><div class=brand><div class=brand-mark>${logoMark()}</div><div><b>دكانك</b><small>سوقك المحلي</small></div></div><div class=gear>${ico('settings')}</div></div><div class=eyebrow>سوقك المحلي في مكان واحد</div><h1>نظّم مبيعاتك<br>من مكان واحد</h1><p>اعرض منتجاتك، شارك متجرك، واستقبل طلباتك عبر واتساب بسهولة.</p><div class=hero-actions><button class=b onclick="go('sell')">أضف متجرك</button><button class="b o" onclick="go('buy')">طلباتي</button></div></section>`;

/* ---------- الحساب ---------- */
function loginForm(t){return `<div class=c><h3>${t}</h3>
<input id=n placeholder="اسمك (للحساب الجديد فقط)"><input id=em type=email placeholder="البريد الإلكتروني"><input id=pw type=password placeholder="كلمة المرور (6 أحرف على الأقل)">
<button class=b onclick="auth(0)">دخول</button><button class="b o" onclick="auth(1)">إنشاء حساب جديد</button></div>`}
async function auth(up){
  const email=$('#em').value.trim(),password=$('#pw').value;
  const r=up?await sb.auth.signUp({email,password,options:{data:{name:$('#n').value.trim()}}}):await sb.auth.signInWithPassword({email,password});
  if(r.error)alert(r.error.message);
}
sb.auth.onAuthStateChange((ev,s)=>{const id=s?.user?.id||null,was=S.user?.id||null;S.user=s?.user||null;if(id!==was){S.favs=loadFavs();if(!booting)render()}});

/* ---------- الرئيسية ---------- */
let Q='';
async function home(a){
  a.innerHTML='<div class="c empty">جاري تحميل المتاجر…</div>';
  const {data,error}=await sb.from('dk_stores').select('id,slug,name,descr,city,category,currency,delivery,min_order,hours,created_at').order('created_at',{ascending:false});
  if(error)throw error;
  (data||[]).forEach(s=>S.stores[s.id]=s);
  a.innerHTML=hero()+`<div class=search-wrap><input id=q placeholder="ابحث عن متجر، مدينة أو قسم..." value="${E(Q)}" oninput="Q=this.value;filterStores()"></div><div class=section-title><h3>متاجر تستحق الاكتشاف</h3><span>${(data||[]).length} متجر</span></div><div id=l></div><section class="c action-panel"><h3>عندك مشروع؟</h3><p class=m>نظّم مبيعاتك، اعرض منتجاتك، واستقبل طلباتك من مكان واحد.</p><button class=b onclick="go('sell')">＋ أضف متجرك</button></section>`;
  filterStores();
}
function card(s){return `<div class="c store-card" onclick="open_('${s.id}')"><div class=row><div class=row style="justify-content:flex-start"><div class=store-icon>${ico('store')}</div><div><b>${E(s.name)}</b><div class=m>${E(s.city||'')} · ${E(s.category||'')}</div></div></div><span>${ico('heart',S.favs.includes(s.id))}</span></div><div class=m>${E(s.descr||'اكتشف منتجات هذا المتجر المحلي')}</div><span class=tag>عرض المتجر ←</span></div>`}
function filterStores(){
  const q=Q.trim().toLowerCase();
  const r=Object.values(S.stores).filter(s=>!q||[s.name,s.city,s.category].join(' ').toLowerCase().includes(q));
  $('#l').innerHTML=r.map(card).join('')||'<div class="c empty">لا توجد متاجر مطابقة حالياً.<br>كن أول من يضيف مشروعه إلى دكانك.</div>';
}
function open_(id){S.store=S.stores[id];S.tab='store';render();scrollTo(0,0)}

/* ---------- صفحة المتجر والسلة ---------- */
const UNITS=['قطعة','كيلو','ليتر','علبة','دزينة'];
const stepOf=u=>(u==='كيلو'||u==='ليتر')?0.5:1;
const rnd=n=>Math.round(n*100)/100;
function imgs(x){return (x.images&&x.images.length)?x.images:(x.image?[x.image]:[])}
function gal(x){const a=imgs(x);if(!a.length)return '';return a.length===1?`<img src="${E(a[0])}" alt="" loading="lazy" onclick="zoomImg(this)" style="cursor:zoom-in">`:`<div class=gal>${a.map(u=>`<img src="${E(u)}" alt="" loading="lazy" onclick="zoomImg(this)" style="cursor:zoom-in">`).join('')}</div>`}
function zoomImg(el){
  const box=el.closest('.gal')||el.parentElement;
  const list=[...box.querySelectorAll('img')].map(i=>i.currentSrc||i.src);
  let k=Math.max(0,list.indexOf(el.currentSrc||el.src)),x0=0;
  const o=document.createElement('div');o.id='lb';
  o.innerHTML='<button class="lbx" aria-label="إغلاق">✕</button>'+(list.length>1?'<button class="lbn lbp" aria-label="السابق">›</button><button class="lbn lbq" aria-label="التالي">‹</button><div class="lbc"></div>':'')+'<img alt="">';
  const im=o.querySelector('img'),ct=o.querySelector('.lbc');
  const show=()=>{im.src=list[k];if(ct)ct.textContent=(k+1)+' / '+list.length};
  const go=d=>{k=(k+d+list.length)%list.length;show()};
  const kd=e=>{if(e.key==='Escape')close();if(e.key==='ArrowLeft')go(1);if(e.key==='ArrowRight')go(-1)};
  const close=()=>{o.remove();document.removeEventListener('keydown',kd)};
  o.onclick=e=>{if(e.target===o||e.target.classList.contains('lbx'))close()};
  const nx=o.querySelector('.lbq'),pv=o.querySelector('.lbp');
  if(nx){nx.onclick=e=>{e.stopPropagation();go(1)};pv.onclick=e=>{e.stopPropagation();go(-1)}}
  o.addEventListener('touchstart',e=>{x0=e.changedTouches[0].clientX},{passive:true});
  o.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(list.length>1&&Math.abs(d)>50)go(d<0?1:-1)},{passive:true});
  document.addEventListener('keydown',kd);
  show();document.body.appendChild(o);
}
function cartInfo(){return {n:S.cart.length,sum:rnd(S.cart.reduce((n,i)=>n+i.q*i.price,0))}}
function setQ(id,v){v=+v;const i=S.cart.find(x=>x.id===id);if(!i)return;if(!(v>0))S.cart=S.cart.filter(x=>x.id!==id);else i.q=rnd(v);if(!S.cart.length)return render();checkout()}
async function storeView(a){
  const s=S.store;
  const {data:p}=await sb.from('dk_products').select('*').eq('store_id',s.id).eq('available',true).order('created_at');
  (p||[]).forEach(x=>S.prods[x.id]=x);
  const {n,sum}=S.cartStore===s.id?cartInfo():{n:0,sum:0};
  a.innerHTML=`<div class=h><button class=i onclick="go('home')">→</button><h2>${E(s.name)}</h2><button class=i onclick="fav('${s.id}')">${ico('heart',S.favs.includes(s.id))}</button></div>
<p class=m>${E(s.descr||'')}</p><p class=m>📍 ${E(s.city||'')} — ${E(s.category||'')} — 🕒 ${E(s.hours||'غير محدد')}</p>
<p class=m>التوصيل: ${s.delivery} ${E(s.currency)} — أقل طلب: ${s.min_order} ${E(s.currency)}</p>
<button class="b o" onclick="share('${E(s.slug)}')">📋 انسخ رابط المتجر</button>
<div class=g>${(p||[]).map(x=>`<div class=c>${gal(x)}<b>${E(x.name)}</b><div class=m>${x.price} ${E(s.currency)} / ${E(x.unit||'قطعة')}</div><button class=b onclick="add('${x.id}')">أضف للسلة</button></div>`).join('')||'<div class=c>لا توجد منتجات بعد.</div>'}</div>
${n?`<div class=cb><span style="flex:1">${n} منتج — ${sum} ${E(s.currency)}</span><button class=b onclick="checkout()">إتمام الطلب</button></div>`:''}`;
}
function add(id){
  const p=S.prods[id];if(S.cartStore!==S.store.id){S.cart=[];S.cartStore=S.store.id}
  const u=p.unit||'قطعة',stp=stepOf(u);const i=S.cart.find(x=>x.id===id);i?i.q=rnd(i.q+stp):S.cart.push({id,name:p.name,price:+p.price,q:stp,unit:u});render();
}
function shareUrl(slug){return location.origin+location.pathname+'?s='+encodeURIComponent(slug)}
async function share(slug){
  const url=shareUrl(slug);
  try{await navigator.clipboard.writeText(url);alert('✅ تم نسخ الرابط')}
  catch(e){
    const t=document.createElement('textarea');t.value=url;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(_){}
    t.remove();
    if(ok)alert('✅ تم نسخ الرابط');else prompt('انسخ الرابط:',url);
  }
}
function checkout(){
  const s=S.store,{sum}=cartInfo();
  $('#app').innerHTML=hd('إتمام الطلب')+`<div class=c>
${S.cart.map(i=>`<div class=row><span style="flex:1">${E(i.name)}<div class=m>${i.price} ${E(s.currency)} / ${E(i.unit||'قطعة')}</div></span><input type=number inputmode=decimal min=0 step=${stepOf(i.unit)} value=${i.q} onchange="setQ('${i.id}',this.value)" style="width:76px;margin:0 8px"><span>${rnd(i.q*i.price)} ${E(s.currency)}</span></div>`).join('')}
<hr style="border-color:var(--bd)"><div class=row><span>التوصيل</span><span>${s.delivery} ${E(s.currency)}</span></div>
<div class=row><b>المجموع</b><b>${rnd(sum+ +s.delivery)} ${E(s.currency)}</b></div></div>
<div class=c><input id=bn placeholder="اسمك" value="${E(S.user?.user_metadata?.name||'')}"><input id=bp type=tel placeholder="رقم هاتفك"><label class=m>طريقة الاستلام</label><select id=bd onchange="document.getElementById('bb').style.display=this.value==='branch'?'block':'none'"><option value=home>توصيل للبيت</option><option value=branch>استلام من فرع شحن</option></select><input id=bb placeholder="اسم فرع الشحن والمدينة" style="display:none"><textarea id=ba rows=2 placeholder="العنوان"></textarea><label class=m>طريقة الدفع</label><select id=bpay><option value=cod>الدفع عند الاستلام</option><option value=sham>شام كاش</option></select><div class=m>تفاصيل الدفع بتنتفق عليها مع صاحب المتجر على واتساب.</div>
<button class=b onclick="send()">أرسل الطلب عبر واتساب</button><button class="b o" onclick="render()">رجوع</button></div>`;
}
async function send(){
  const s=S.store,{sum}=cartInfo(),total=rnd(sum+ +s.delivery);
  if(sum<+s.min_order)return alert('أقل قيمة للطلب هي '+s.min_order+' '+s.currency);
  const nm=$('#bn').value.trim(),ph=$('#bp').value.trim(),ad=$('#ba').value.trim(),dv=$('#bd').value,br=$('#bb').value.trim(),pay=$('#bpay').value==='sham'?'شام كاش':'الدفع عند الاستلام';
  if(!nm||!ph)return alert('الاسم ورقم الهاتف مطلوبان');
  if(dv==='home'&&!ad)return alert('اكتب عنوان التوصيل');
  if(dv==='branch'&&!br)return alert('اكتب اسم فرع الشحن والمدينة');
  const recv=dv==='home'?'توصيل للبيت — '+ad:'فرع شحن — '+br+(ad?' — '+ad:''),full=recv+' | الدفع: '+pay;
  const items=S.cart.map(i=>({name:i.name,price:i.price,q:i.q,unit:i.unit||'قطعة'}));
  const {error}=await sb.from('dk_orders').insert({store_id:s.id,buyer_name:nm,buyer_phone:ph,address:full,items,total});
  if(error)return alert('تعذّر إرسال الطلب: '+error.message);
  const txt=`طلب جديد من دكانك\n${items.map(i=>`- ${i.name} × ${i.q} ${i.unit}`).join('\n')}\nالمجموع: ${total} ${s.currency}\nالاسم: ${nm}\nالهاتف: ${ph}\nالاستلام: ${recv}\nالدفع: ${pay}`;
  S.cart=[];S.cartStore=null;
  location.href=`https://wa.me/${s.whatsapp.replace(/\D/g,'')}?text=${encodeURIComponent(txt)}`;
}

/* ---------- المشتري ---------- */
async function buy(a){
  if(!S.user)return a.innerHTML=hd('مشترٍ')+loginForm('سجّل دخولك لتتابع طلباتك');
  const {data:o}=await sb.from('dk_orders').select('*,dk_stores(name,currency)').eq('buyer',S.user.id).order('created_at',{ascending:false});
  const sum=(o||[]).filter(x=>x.status!=='cancel').reduce((n,x)=>n+ +x.total,0);
  a.innerHTML=hd('طلباتي')+`<div class=st><div class=c><b>${(o||[]).length}</b>طلب</div><div class=c><b>${sum}</b>أنفقت</div></div>`+
  ((o||[]).map(x=>`<div class=c><div class=row><b>${E(x.dk_stores?.name)}</b><span class=tag>${ST[x.status]||x.status}</span></div>
<div class=m>${(x.items||[]).map(i=>E(i.name)+' ×'+i.q+' '+E(i.unit||'')).join('، ')}</div><div class=m>${x.total} ${E(x.dk_stores?.currency)} — ${new Date(x.created_at).toLocaleDateString('ar')}</div></div>`).join('')||'<div class=c>لم تطلب شيئًا بعد. تصفح المتاجر من الرئيسية.</div>');
}

/* ---------- البائع ---------- */
async function sell(a){
  if(!S.user)return a.innerHTML=hd('بائع')+loginForm('سجّل دخولك لتفتح متجرك');
  const {data:st}=await sb.from('dk_stores').select('*').eq('owner',S.user.id).maybeSingle();
  if(st){S.stores[st.id]=st;S.store=st}
  if(!st)return a.innerHTML=hd('افتح متجرك')+storeForm();
  const [{data:p},{data:o}]=await Promise.all([
    sb.from('dk_products').select('*').eq('store_id',st.id).order('created_at',{ascending:false}),
    sb.from('dk_orders').select('*').eq('store_id',st.id).order('created_at',{ascending:false})]);
  const inc=(o||[]).filter(x=>x.status==='done').reduce((n,x)=>n+ +x.total,0);
  a.innerHTML=hd(E(st.name))+`<div class=st><div class=c><b>${(o||[]).length}</b>طلب</div><div class=c><b>${inc}</b>الدخل</div><div class=c><b>${(p||[]).length}</b>منتج</div></div>
<div class=c><h3>بيانات المتجر</h3><p class=m>عدّل معلومات المتجر أو إعدادات الطلب والتوصيل في أي وقت.</p><button class="b o" onclick="editStore('${st.id}')">تعديل بيانات المتجر</button></div>
<div class=c><div class=m>رابط متجرك للمشاركة على إنستغرام وغيره:</div><div class=m style="direction:ltr;word-break:break-all">${E(shareUrl(st.slug))}</div>
<button class=b onclick="share('${E(st.slug)}')">📋 انسخ الرابط</button></div>
<div class=c><h3>أضف منتجًا</h3><input id=pn placeholder="اسم المنتج"><div class=row><input id=pp type=number inputmode=decimal step=any placeholder="السعر" style="flex:1;margin-left:8px"><select id=pu style="flex:1">${UNITS.map(u=>`<option>${u}</option>`).join('')}</select></div><div class=m>السعر لكل وحدة، مثلًا 1000 لكل كيلو.</div><input id=pf type=file accept="image/*" multiple><div class=m>تقدر تختار حتى 4 صور.</div>
<button class=b onclick="addProd('${st.id}')">حفظ المنتج</button></div>
<h3>منتجاتي</h3>${(p||[]).map(x=>`<div class="c row">${imgs(x)[0]?`<img class=pi style="width:56px;height:56px;margin:0" src="${E(imgs(x)[0])}">`:''}<span style="flex:1">${E(x.name)}<div class=m>${x.price} ${E(st.currency)} / ${E(x.unit||'قطعة')}${imgs(x).length>1?' — '+imgs(x).length+' صور':''}</div></span><button class="i" onclick="editProd('${x.id}')" aria-label="تعديل المنتج">✎</button><button class="i" onclick="delProd('${x.id}')" aria-label="حذف المنتج">${ico('trash')}</button></div>`).join('')||'<div class=c>لا منتجات بعد.</div>'}
<h3>الطلبات</h3>${(o||[]).map(x=>`<div class=c><div class=row><b>${E(x.buyer_name)}</b><span>${x.total} ${E(st.currency)}</span></div>
<div class=m>${(x.items||[]).map(i=>E(i.name)+' ×'+i.q+' '+E(i.unit||'')).join('، ')}</div><div class=m>📞 ${E(x.buyer_phone)} — ${E(x.address||'')}</div>
<select onchange="setSt('${x.id}',this.value)">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${x.status===k?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')||'<div class=c>لا طلبات بعد.</div>'}
<h3>منطقة الخطر</h3><div class=c><div class=m>حذف المتجر يمسح منتجاته وطلباته نهائيًا، وبعدها تقدر تفتح متجرًا جديدًا.</div>
<button class=b style="background:#b3261e;color:#fff" onclick="delStore('${st.id}')">${ico('trash')} حذف المتجر</button></div>`;
}
function storeForm(st={},mode='create'){
  const val=(key, fallback='')=>E(st[key]??fallback);
  return `<div class=c><p class=m>ابدأ بالمعلومات الأساسية، ويمكنك تعديلها لاحقاً.</p>
<label>اسم المتجر<input id=f1 placeholder="مثال: حلويات أبو النور" value="${val('name')}"></label>
<label>وصف قصير<input id=f2 placeholder="ماذا تبيع؟" value="${val('descr')}"></label>
<label>واتساب مع رمز الدولة<input id=f3 type=tel placeholder="963991234567" value="${val('whatsapp')}"></label>
<label>المدينة والحي<input id=f4 placeholder="مثال: اللاذقية — مشروع الصليبة" value="${val('city')}"></label>
<label>القسم<input id=f5 placeholder="حلويات، ملابس، حقائب..." value="${val('category')}"></label>
<label>العملة<select id=f6><option ${val('currency')==='$'?'selected':''}>$</option><option ${val('currency')==='ل.س'?'selected':''}>ل.س</option><option ${val('currency')==='د.أ'?'selected':''}>د.أ</option><option ${val('currency')==='ر.س'?'selected':''}>ر.س</option></select></label>
<label>رسوم التوصيل<input id=f7 type=number min="0" inputmode="decimal" placeholder="0 إن لم يوجد" value="${val('delivery',0)}"></label>
<label>أقل قيمة للطلب<input id=f8 type=number min="0" inputmode="decimal" placeholder="0 إن لم يوجد" value="${val('min_order',0)}"></label>
<label>ساعات العمل<input id=f9 placeholder="مثال: 10 ص - 10 م" value="${val('hours')}"></label>
<button class=b onclick="${mode==='edit'?`saveStore('${E(st.id)}')`:'mkStore()'}">${mode==='edit'?'حفظ تعديلات المتجر':'إنشاء المتجر'}</button>
${mode==='edit'?'<button class="b o" onclick="render()">إلغاء</button>':''}</div>`;
}
function editStore(id){const st=S.stores[id]||S.store;$('#app').innerHTML=hd('تعديل المتجر')+storeForm(st,'edit');scrollTo(0,0)}
async function delStore(id){
  if(!confirm('سيتم حذف المتجر وكل منتجاته وطلباته نهائيًا. هل أنت متأكد؟'))return;
  await sb.from('dk_products').delete().eq('store_id',id);
  await sb.from('dk_orders').delete().eq('store_id',id);
  const {data,error}=await sb.from('dk_stores').delete().eq('id',id).select();
  if(error)return alert('تعذّر الحذف: '+error.message);
  if(!data||!data.length)return alert('لم يُحذف المتجر. شغّل ملفات SQL في Supabase أولًا.');
  delete S.stores[id];
  if(S.store&&S.store.id===id)S.store=null;
  render();
}
async function mkStore(){
  const v=i=>$('#f'+i).value.trim(),name=v(1);
  if(!name||!v(3))return alert('اسم المتجر ورقم واتساب مطلوبان');
  const slug=(name.replace(/\s+/g,'-').replace(/[^\p{L}\p{N}-]/gu,'')||'متجر')+'-'+(100+Math.floor(Math.random()*900));
  const {error}=await sb.from('dk_stores').insert({slug,name,descr:v(2),whatsapp:v(3),city:v(4),category:v(5),currency:v(6),delivery:+v(7)||0,min_order:+v(8)||0,hours:v(9)});
  if(error)return alert('تعذّر إنشاء المتجر: '+error.message);
  alert('تم إنشاء متجرك بنجاح');
  render();
}
async function saveStore(id){
  const v=i=>$('#f'+i).value.trim(),name=v(1);
  if(!name||!v(3))return alert('اسم المتجر ورقم واتساب مطلوبان');
  const {error}=await sb.from('dk_stores').update({name,descr:v(2),whatsapp:v(3),city:v(4),category:v(5),currency:v(6),delivery:+v(7)||0,min_order:+v(8)||0,hours:v(9)}).eq('id',id).eq('owner',S.user.id);
  if(error)return alert('تعذّر حفظ تعديلات المتجر: '+error.message);
  const {data}=await sb.from('dk_stores').select('*').eq('id',id).maybeSingle();
  if(data){S.stores[id]=data;S.store=data}
  alert('تم حفظ تعديلات المتجر');
  render();
}
function shrink(f){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const r=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||f),'image/jpeg',.82)};im.onerror=()=>res(f);im.src=u})}
async function addProd(sid){
  const name=$('#pn').value.trim(),price=+$('#pp').value,unit=$('#pu').value||'قطعة',files=[...$('#pf').files].slice(0,4);
  if(!name||!(price>=0)||$('#pp').value==='')return alert('اسم المنتج والسعر مطلوبان');
  const urls=[];
  for(let k=0;k<files.length;k++){
    const b=await shrink(files[k]);
    const path=`${S.user.id}/${Date.now()}_${k}.jpg`;
    const u=await sb.storage.from('dk-images').upload(path,b,{contentType:'image/jpeg'});
    if(u.error)return alert('تعذّر رفع الصورة: '+u.error.message);
    urls.push(sb.storage.from('dk-images').getPublicUrl(path).data.publicUrl);
  }
  const {error}=await sb.from('dk_products').insert({store_id:sid,name,price,unit,image:urls[0]||null,images:urls});
  if(error)return alert(/column/i.test(error.message)?'شغّل ملف products.sql في Supabase أولًا':error.message);
  render();
}
function editProd(id){
  const p=S.prods[id];
  if(!p)return alert('تعذّر العثور على المنتج');
  $('#app').innerHTML=hd('تعديل المنتج')+`<div class=c>
<label>اسم المنتج<input id=epn value="${E(p.name)}"></label>
<label>السعر<input id=epp type=number inputmode=decimal step=any value="${E(p.price)}"></label>
<label>الوحدة<select id=epu>${UNITS.map(u=>`<option ${u===(p.unit||'قطعة')?'selected':''}>${u}</option>`).join('')}</select></label>
<button class=b onclick="saveProd('${E(id)}','${E(p.store_id)}')">حفظ تعديلات المنتج</button>
<button class="b o" onclick="render()">إلغاء</button></div>`;
  scrollTo(0,0);
}
async function saveProd(id,sid){
  const name=$('#epn').value.trim(),price=+$('#epp').value,unit=$('#epu').value;
  if(!name||!(price>=0)||$('#epp').value==='')return alert('اسم المنتج والسعر مطلوبان');
  const {error}=await sb.from('dk_products').update({name,price,unit}).eq('id',id).eq('store_id',sid);
  if(error)return alert('تعذّر حفظ المنتج: '+error.message);
  alert('تم حفظ تعديلات المنتج');
  render();
}
async function delProd(id){if(confirm('حذف المنتج؟')){await sb.from('dk_products').delete().eq('id',id);render()}}
async function setSt(id,status){const {error}=await sb.from('dk_orders').update({status}).eq('id',id);if(error)alert(error.message)}

/* ---------- المفضلة ---------- */
async function fav(a){
  if(typeof a==='string')return favToggle(a);
  const {data}=await sb.from('dk_stores').select('*').in('id',S.favs.length?S.favs:['00000000-0000-0000-0000-000000000000']);
  (data||[]).forEach(s=>S.stores[s.id]=s);
  a.innerHTML=hd('المفضلة')+((data||[]).map(card).join('')||'<div class=c>لم تضف متجرًا للمفضلة بعد. اضغط 🤍 داخل أي متجر.</div>');
}
function favToggle(id){S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id];localStorage.setItem(favKey(),JSON.stringify(S.favs));render()}

/* ---------- المزيد ---------- */
async function adminPanel(){
  if(!S.user)return '';
  const {data:ad}=await sb.from('dk_admins').select('user_id').eq('user_id',S.user.id).maybeSingle();
  if(!ad)return '';
  const [{data:st},{data:cm}]=await Promise.all([
    sb.from('dk_stores').select('id,name,city,slug').order('created_at',{ascending:false}),
    sb.from('dk_complaints').select('*').order('created_at',{ascending:false}).limit(50)]);
  return `<h3>لوحة الإدارة</h3><div class=c><b>المتاجر (${(st||[]).length})</b></div>`+
  ((st||[]).map(x=>`<div class="c row"><span style="flex:1">${E(x.name)}<div class=m>${E(x.city||'')}</div></span><button class="i" onclick="delStore('${x.id}')">${ico('trash')}</button></div>`).join('')||'<div class=c>لا متاجر.</div>')+
  `<div class=c><b>الرسائل والشكاوى (${(cm||[]).length})</b></div>`+
  ((cm||[]).map(x=>`<div class="c row"><span style="flex:1">${E(x.msg)}<div class=m>${x.created_at?new Date(x.created_at).toLocaleString('ar'):''}</div></span><button class="i" onclick="delMsg('${x.id}')">${ico('trash')}</button></div>`).join('')||'<div class=c>لا رسائل.</div>');
}
async function delMsg(id){if(!confirm('حذف الرسالة؟'))return;const {error}=await sb.from('dk_complaints').delete().eq('id',id);if(error)return alert(error.message);render()}
async function more(a){
  const adm=await adminPanel();
  a.innerHTML=hd('المزيد')+(S.user?`<div class=c><b>${E(S.user.user_metadata?.name||'')}</b><div class=m>${E(S.user.email)}</div></div>`:'')+
`<button class="b o" onclick="theme()">🌓 تبديل الوضع الليلي والنهاري</button>
<div class=c><h3>مساعدة وشكوى</h3><div class=m>اكتب مشكلتك أو اقتراحك وسنقرؤه.</div><textarea id=cm rows=3 placeholder="رسالتك"></textarea><button class=b onclick="complain()">إرسال</button></div>
${S.user?'<button class="b o" onclick="sb.auth.signOut()">تسجيل الخروج</button>':''}${adm}`;
}
function theme(){const light=document.body.classList.toggle('light');localStorage.dkl=light?'1':'0';render()}
async function complain(){
  if(!S.user)return alert('سجّل دخولك أولًا من تبويب مشتري أو بائع');
  const msg=$('#cm').value.trim();if(!msg)return;
  const {error}=await sb.from('dk_complaints').insert({msg});
  alert(error?error.message:'وصلتنا رسالتك، شكرًا لك');if(!error)$('#cm').value='';
}

/* ---------- فتح رابط متجر مباشرة ---------- */
(async()=>{
  const slug=new URLSearchParams(location.search).get('s');
  const {data:{session}}=await sb.auth.getSession();
  S.user=session?.user||null;
  S.favs=loadFavs();
  if(slug){const {data}=await sb.from('dk_stores').select('id,slug,name,descr,whatsapp,city,category,currency,delivery,min_order,hours').eq('slug',slug).maybeSingle();if(data){S.stores[data.id]=data;S.store=data;S.tab='store'}}
  booting=false;
  render();
})();
</script>
