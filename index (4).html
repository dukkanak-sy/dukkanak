<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f4d36"><link rel="apple-touch-icon" href="icon-192.png">
<title>دكانك – متجرك على واتساب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2a22;--paper:#faf8f2;--green:#1f4d36;--saffron:#e9a21a;--line:#e3dfd2;--mute:#6b746d;--card:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#eef0ea;--paper:#141a16;--green:#3f9a69;--saffron:#f0b43a;--line:#2b352e;--mute:#9aa79e;--card:#1b231e}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.6;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:30px;font-weight:800;margin:8px 0 2px;color:var(--green)}
h2{font-size:19px;margin:22px 0 8px}
p.sub{margin:0 0 14px;color:var(--mute)}
input,button{font:inherit}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:8px}
input:focus,button:focus-visible{outline:2px solid var(--saffron);outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1}.row>.sm{flex:0 0 76px}
button{border:0;border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:700;background:var(--green);color:#fff}
button.alt{background:transparent;color:var(--green);border:1px solid var(--green)}
button.gold{background:var(--saffron);color:#1d1a10}
button.full{width:100%}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ic{width:52px;height:52px;border-radius:10px;background:var(--paper);display:grid;place-items:center;font-size:28px;overflow:hidden;flex:none}
.ic img{width:100%;height:100%;object-fit:cover}
.grow{flex:1;min-width:0}.name{font-weight:700}.price{color:var(--mute)}
.qty{display:flex;align-items:center;gap:8px}.qty button{padding:4px 12px}
.empty{color:var(--mute);padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.bar{position:sticky;bottom:0;background:var(--paper);padding:12px 0;border-top:1px solid var(--line)}
.shop-head{background:var(--green);color:#fff;padding:22px 16px;border-radius:0 0 18px 18px}
.shop-head h1{color:#fff;margin:0}
.toast{position:fixed;bottom:84px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:20px;display:none}
.hide{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const enc=o=>{const b=new TextEncoder().encode(JSON.stringify(o));let s='';b.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const dec=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');const s=atob(t),b=Uint8Array.from(s,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(b))};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isImg=s=>/^https?:\/\//.test(s);
const icon=s=>isImg(s)?`<img src="${esc(s)}" alt="">`:esc(s||'🛍️');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}

/* ---------- وضع الزبون ---------- */
function customer(shop){
  const cart={};
  document.title=shop.n;
  app.innerHTML=`<div class="shop-head"><h1>${esc(shop.n)}</h1><div>اختر طلبك وأرسله لنا على واتساب</div></div>
  <div class="wrap"><div id="list"></div>
  <h2>بياناتك</h2><input id="cn" placeholder="الاسم"><input id="ca" placeholder="العنوان أو ملاحظات التوصيل">
  <div class="bar"><button class="gold full" id="send">أرسل الطلب عبر واتساب</button></div></div>`;
  const list=$('#list');
  const draw=()=>{list.innerHTML=shop.p.map((p,i)=>`<div class="item"><div class="ic">${icon(p[0])}</div>
    <div class="grow"><div class="name">${esc(p[1])}</div><div class="price">${esc(p[2])} ${esc(shop.c)}</div></div>
    <div class="qty"><button class="alt" data-m="${i}" aria-label="إنقاص">−</button><b>${cart[i]||0}</b><button data-a="${i}" aria-label="زيادة">+</button></div></div>`).join('')};
  draw();
  list.onclick=e=>{const a=e.target.dataset.a,m=e.target.dataset.m;
    if(a!=null)cart[a]=(cart[a]||0)+1; if(m!=null&&cart[m])cart[m]--; draw()};
  $('#send').onclick=()=>{
    const lines=shop.p.map((p,i)=>cart[i]?`• ${p[1]} × ${cart[i]} = ${(+p[2]||0)*cart[i]} ${shop.c}`:null).filter(Boolean);
    if(!lines.length)return toast('اختر منتجاً واحداً على الأقل');
    const total=shop.p.reduce((s,p,i)=>s+(cart[i]||0)*(+p[2]||0),0);
    const name=$('#cn').value.trim(),addr=$('#ca').value.trim();
    const msg=`طلب جديد 🛒\n${lines.join('\n')}\nالمجموع: ${total} ${shop.c}\n${name?'الاسم: '+name+'\n':''}${addr?'العنوان: '+addr:''}`;
    location.href=`https://wa.me/${shop.w}?text=${encodeURIComponent(msg)}`;
  };
}

/* ---------- وضع التاجر ---------- */
function merchant(){
  let d={n:'',w:'',c:'$',p:[]};
  try{const s=localStorage.getItem('dukkanak');if(s)d=JSON.parse(s)}catch(e){}
  const save=()=>{try{localStorage.setItem('dukkanak',JSON.stringify(d))}catch(e){}};
  app.innerHTML=`<div class="wrap"><h1>دكانك</h1><p class="sub">سوِّ متجرك وشاركه على واتساب في دقيقتين</p>
  <h2>معلومات المتجر</h2>
  <input id="n" placeholder="اسم المتجر، مثل: حلويات أم أحمد">
  <div class="row"><input id="w" inputmode="numeric" placeholder="رقم واتساب مع رمز الدولة، مثل 962791234567"><input class="sm" id="c" placeholder="العملة"></div>
  <h2>أضف منتجاً</h2>
  <div class="row"><input class="sm" id="pi" placeholder="🍰"><input id="pn" placeholder="اسم المنتج"><input class="sm" id="pp" inputmode="decimal" placeholder="السعر"></div>
  <input id="pu" placeholder="رابط صورة (اختياري، يبدأ بـ https)">
  <button class="full" id="add">أضف المنتج</button>
  <h2>منتجاتك</h2><div id="list"></div>
  <div class="bar"><button class="gold full" id="gen">انسخ رابط متجرك</button>
  <div class="row" style="margin-top:8px"><button class="alt" id="prev">معاينة المتجر</button></div></div></div>`;
  $('#n').value=d.n;$('#w').value=d.w;$('#c').value=d.c;
  const draw=()=>{$('#list').innerHTML=d.p.length?d.p.map((p,i)=>`<div class="item"><div class="ic">${icon(p[0])}</div>
    <div class="grow"><div class="name">${esc(p[1])}</div><div class="price">${esc(p[2])} ${esc(d.c)}</div></div>
    <button class="alt" data-d="${i}">حذف</button></div>`).join(''):'<div class="empty">لا توجد منتجات بعد. أضف أول منتج من الأعلى.</div>'};
  draw();
  const sync=()=>{d.n=$('#n').value.trim();d.w=$('#w').value.replace(/\D/g,'');d.c=$('#c').value.trim()||'$';save()};
  ['#n','#w','#c'].forEach(s=>$(s).oninput=sync);
  $('#add').onclick=()=>{sync();const nm=$('#pn').value.trim(),pr=$('#pp').value.trim();
    if(!nm||!pr)return toast('اكتب اسم المنتج وسعره');
    const u=$('#pu').value.trim();
    d.p.push([isImg(u)?u:($('#pi').value.trim()||'🛍️'),nm,pr]);save();
    ['#pi','#pn','#pp','#pu'].forEach(s=>$(s).value='');draw()};
  $('#list').onclick=e=>{const x=e.target.dataset.d;if(x!=null){d.p.splice(x,1);save();draw()}};
  const link=()=>{sync();if(!d.n||!d.w||!d.p.length){toast('أكمل الاسم والرقم وأضف منتجاً');return null}
    return location.origin+location.pathname+'#'+enc(d)};
  $('#gen').onclick=async()=>{const l=link();if(!l)return;
    try{await navigator.clipboard.writeText(l);toast('تم نسخ الرابط، شاركه مع زبائنك')}catch(e){prompt('انسخ الرابط:',l)}};
  $('#prev').onclick=()=>{const l=link();if(l)window.open(l,'_blank')};
}

function route(){
  const h=location.hash.slice(1);
  if(h){try{return customer(dec(h))}catch(e){}}
  merchant();
}
addEventListener('hashchange',route);route();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
